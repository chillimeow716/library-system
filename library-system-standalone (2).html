<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖書室</title>
<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --line:#e8e3d9; --line-faint:#f0ece2;
  --ink:#24221e; --ink-soft:#726b5d; --ink-faint:#a49b89;
  --accent:#3c6e64; --accent-deep:#2a4d46; --accent-soft:#e7efec;
  --red:#b3492f; --red-soft:#f6e4de;
  --amber:#8a5a1f; --amber-soft:#f4ecdb;
  --plum:#6d5a7e;
  --radius:6px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:14.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2{ font-family:"Noto Serif TC","PMingLiU",serif; margin:0; font-weight:600; }
button{ font-family:inherit; cursor:pointer; background:none; }
input,select,textarea{ font-family:inherit; }
a{ color:inherit; }

.app-shell{ display:flex; min-height:100vh; }
.sidebar{
  width:216px; background:var(--surface); border-right:1px solid var(--line);
  padding:26px 16px; position:fixed; top:0; bottom:0; left:0; display:flex; flex-direction:column;
  transform:translateX(0); transition:transform .2s; z-index:50;
}
.sidebar .logo{ font-size:17px; letter-spacing:.5px; padding:0 8px 22px; }
.sidebar .search-mini{ margin:0 0 18px; padding:0 4px; }
.sidebar .search-mini input{ width:100%; border:1px solid var(--line); border-radius:14px; padding:6px 12px; font-size:12.5px; background:var(--bg); color:var(--ink-soft); }
.sidebar nav{ display:flex; flex-direction:column; gap:1px; }
.sidebar nav button{ text-align:left; border:none; padding:8px 10px; border-radius:6px; font-size:13.5px; color:var(--ink-soft); width:100%; }
.sidebar nav button:hover{ background:var(--line-faint); color:var(--ink); }
.sidebar nav button.active{ background:var(--accent-soft); color:var(--accent-deep); font-weight:600; }
.sidebar .divider{ height:1px; background:var(--line); margin:14px 10px; }
.sidebar .foot{ margin-top:auto; padding:0 10px; font-size:11px; color:var(--ink-faint); }
.sidebar-overlay{ display:none; }
.mobile-topbar{ display:none; }
.content{ margin-left:216px; padding:44px 52px 120px; max-width:760px; width:100%; }

@media(max-width:860px){
  .sidebar{ transform:translateX(-100%); box-shadow:2px 0 16px rgba(0,0,0,0.12); }
  .sidebar.show{ transform:translateX(0); }
  .sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.2); z-index:45; }
  .sidebar-overlay.show{ display:block; }
  .content{ margin-left:0; padding:76px 18px 110px; max-width:100%; }
  .mobile-topbar{ display:flex; align-items:center; gap:12px; position:fixed; top:0; left:0; right:0; height:54px; background:var(--surface); border-bottom:1px solid var(--line); padding:0 14px; z-index:40; }
  .mobile-topbar .ham{ font-size:20px; border:none; background:none; padding:6px; color:var(--ink); }
  .mobile-topbar .title{ font-size:15px; font-weight:600; }
}
.hidden{ display:none !important; }

.fab{ position:fixed; right:26px; bottom:26px; z-index:55; background:var(--accent); color:#fff; border:none; border-radius:24px; padding:13px 20px; font-size:14px; box-shadow:0 3px 10px rgba(0,0,0,0.18); }
.fab:hover{ background:var(--accent-deep); }

.page-title{ font-size:25px; margin-bottom:4px; }
.page-sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:34px; }
.section-label{ font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-faint); margin:34px 0 10px; display:flex; align-items:center; gap:8px; }
.section-label:first-of-type{ margin-top:0; }
.empty-note{ font-size:13px; color:var(--ink-faint); padding:8px 2px; }
.link-btn{ font-size:12.5px; color:var(--accent-deep); text-decoration:underline; background:none; border:none; padding:0; }

.task-row{ display:flex; align-items:center; gap:11px; padding:10px 4px; border-bottom:1px solid var(--line-faint); cursor:pointer; }
.task-row:hover{ background:#f8f5ef; }
.task-check{ width:16px; height:16px; border:1.5px solid var(--ink-faint); border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; }
.task-check.checked{ background:var(--accent); border-color:var(--accent); }
.task-main{ flex:1; min-width:0; }
.task-title{ font-size:14.5px; color:var(--ink); }
.task-title.done{ color:var(--ink-faint); text-decoration:line-through; }
.task-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }
.task-meta{ font-size:11.5px; color:var(--ink-faint); white-space:nowrap; flex-shrink:0; }
.task-meta.overdue{ color:var(--red); }
.task-meta.soon{ color:var(--amber); }
.row-actions{ display:flex; gap:2px; opacity:0; transition:opacity .15s; flex-shrink:0; }
.task-row:hover .row-actions{ opacity:1; }
.row-actions button{ border:none; font-size:15px; padding:3px 6px; border-radius:5px; color:var(--ink-soft); }
.row-actions button:hover{ background:var(--line-faint); }

.attn-line{ padding:8px 3px; font-size:13.5px; border-bottom:1px solid var(--line-faint); cursor:pointer; }
.attn-line .mk{ margin-right:6px; }
.attn-line.urgent{ color:var(--red); }
.attn-line.warn{ color:var(--amber); }
.attn-line:hover{ background:#f8f5ef; }

.up-row{ display:flex; align-items:center; gap:10px; padding:11px 3px; border-bottom:1px solid var(--line-faint); }
.up-main{ flex:1; min-width:0; cursor:pointer; }
.up-title{ font-size:14px; }
.up-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; }
.up-sub.prep{ color:var(--accent-deep); }
.up-action{ flex-shrink:0; }
.up-action button{ border:1px solid var(--accent); color:var(--accent-deep); background:transparent; border-radius:12px; padding:4px 11px; font-size:11.5px; }
.up-action button:hover{ background:var(--accent-soft); }

.proj-row{ padding:14px 4px; border-bottom:1px solid var(--line-faint); cursor:pointer; }
.proj-row:hover{ background:#f8f5ef; }
.proj-name{ font-size:15px; font-weight:600; }
.proj-cat{ font-size:11.5px; color:var(--ink-faint); margin-left:8px; font-weight:400; }
.proj-bar{ height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin:8px 0 6px; }
.proj-bar-fill{ height:100%; background:var(--accent); }
.proj-foot{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); }

.segmented{ display:flex; gap:18px; border-bottom:1px solid var(--line); margin-bottom:6px; flex-wrap:wrap; }
.segmented button{ border:none; padding:8px 2px; font-size:13.5px; color:var(--ink-faint); border-bottom:2px solid transparent; margin-bottom:-1px; }
.segmented button.active{ color:var(--ink); border-color:var(--accent); font-weight:600; }

.toolbar-line{ display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
.toolbar-line input[type=text],.toolbar-line input[type=search]{ border:1px solid var(--line); border-radius:14px; padding:6px 13px; font-size:13px; background:var(--surface); flex:1; min-width:140px; }
.toolbar-line select{ border:1px solid var(--line); border-radius:14px; padding:6px 11px; font-size:12.5px; background:var(--surface); color:var(--ink-soft); }
.toolbar-line .spacer{ flex:1; }
.btn{ border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:6px 14px; font-size:12.5px; color:var(--ink); }
.btn:hover{ border-color:var(--ink-faint); }
.btn.primary{ background:var(--accent); border-color:var(--accent-deep); color:#fff; }
.btn.primary:hover{ background:var(--accent-deep); }
.btn.danger{ color:var(--red); border-color:var(--red); background:transparent; }
.btn.danger:hover{ background:var(--red-soft); }
.btn.small{ padding:3px 9px; font-size:11px; border-radius:10px; }

.drawer-overlay{ position:fixed; inset:0; background:rgba(30,28,24,0.18); z-index:64; display:none; }
.drawer-overlay.show{ display:block; }
.drawer{ position:fixed; top:0; right:0; bottom:0; width:430px; max-width:92vw; background:var(--surface); box-shadow:-6px 0 24px rgba(0,0,0,0.1); transform:translateX(100%); transition:transform .22s ease; z-index:65; overflow-y:auto; padding:28px 26px 60px; }
.drawer.show{ transform:translateX(0); }
.drawer-close{ position:absolute; top:18px; right:18px; font-size:20px; border:none; color:var(--ink-faint); background:none; }
.drawer h2{ font-size:19px; margin-bottom:18px; padding-right:26px; }
.d-field{ margin-bottom:13px; }
.d-field label{ display:block; font-size:11px; color:var(--ink-faint); margin-bottom:4px; letter-spacing:.3px; }
.d-field input, .d-field select, .d-field textarea{ width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; background:var(--bg); color:var(--ink); }
.d-field textarea{ resize:vertical; min-height:44px; }
.d-row2{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.d-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
.d-section-label{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 8px; border-top:1px solid var(--line-faint); padding-top:16px; }
.d-section-label:first-of-type{ border-top:none; padding-top:0; margin-top:0; }
.drawer-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; flex-wrap:wrap; gap:8px; }
.conflict-warn{ font-size:12px; color:var(--red); background:var(--red-soft); border-radius:6px; padding:7px 10px; margin-top:6px; }
.conflict-warn.mild{ color:var(--amber); background:var(--amber-soft); }

.modal-overlay{ position:fixed; inset:0; background:rgba(30,28,24,0.25); display:none; align-items:center; justify-content:center; z-index:70; padding:16px; overflow:auto; }
.modal-overlay.show{ display:flex; }
.modal-box{ background:var(--surface); width:100%; max-width:460px; border-radius:10px; padding:22px; box-shadow:0 8px 30px rgba(0,0,0,0.18); max-height:90vh; overflow:auto; }
.modal-box h2{ font-size:16px; margin-bottom:14px; }
.qa-input{ width:100%; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); }
.more-toggle{ font-size:12px; color:var(--accent-deep); text-decoration:underline; cursor:pointer; display:inline-block; margin:9px 0; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; }

.list-plain{ display:flex; flex-direction:column; }
.settings-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 3px; border-bottom:1px solid var(--line-faint); font-size:13.5px; }
.settings-row.archived{ opacity:.5; }
.settings-row .acts{ display:flex; gap:8px; }
.settings-row .acts button{ font-size:11.5px; color:var(--ink-soft); border:none; }
.settings-row .acts button:hover{ color:var(--accent-deep); }

.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.cal-nav{ border:none; background:none; color:var(--ink-soft); font-size:13px; }
.cal-nav:hover{ color:var(--ink); }
.cal-toggles{ display:flex; gap:14px; font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
.cal-toggles label{ display:flex; align-items:center; gap:5px; cursor:pointer; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line-faint); border:1px solid var(--line-faint); }
.cal-dow{ background:var(--bg); font-size:10.5px; text-align:center; color:var(--ink-faint); padding:5px 0; }
.cal-cell{ background:var(--surface); min-height:74px; padding:5px; font-size:10.5px; cursor:pointer; }
.cal-cell.other{ background:var(--bg); }
.cal-cell.today .d-num{ color:var(--accent-deep); font-weight:700; }
.cal-cell:hover{ background:#f8f5ef; }
.cal-cell.conflict{ box-shadow:inset 0 0 0 1.5px var(--red); }
.d-num{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }
.cal-dot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ink-faint); margin-right:3px; }
.cal-dot.ev{ background:var(--accent); }
.cal-dot.school{ background:var(--plum); }
.cal-item-txt{ font-size:9.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-item-txt.school{ color:var(--plum); opacity:.8; }

.sem-month{ margin-bottom:22px; }
.sem-month h3{ font-size:13.5px; font-weight:600; margin-bottom:6px; color:var(--ink); }
.sem-line{ font-size:13px; padding:3px 0 3px 4px; border-left:2px solid var(--line); }
.sem-line.mine{ border-left-color:var(--accent); }
.sem-line.school{ color:var(--ink-faint); border-left-color:var(--plum); }
.sem-line.conflict{ color:var(--red); border-left-color:var(--red); font-weight:600; }

.demo-tag{ font-size:9.5px; color:var(--amber); border:1px solid var(--amber); padding:0 5px; border-radius:8px; margin-left:6px; }
.impact-badge{ font-size:10px; padding:0 6px; border-radius:8px; margin-left:6px; border:1px solid var(--ink-faint); color:var(--ink-faint); }
.impact-badge.high{ border-color:var(--red); color:var(--red); }
.impact-badge.medium{ border-color:var(--amber); color:var(--amber); }

.review-block{ margin-bottom:26px; }
.review-block h3{ font-size:13.5px; font-weight:600; margin-bottom:4px; }
.review-block .rb-sub{ font-size:12px; color:var(--ink-faint); margin-bottom:8px; }
.review-block textarea{ width:100%; border:1px solid var(--line); border-radius:6px; padding:9px; font-size:13px; min-height:60px; background:var(--surface); }

.step-row{ display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line-faint); }
.step-row .step-check{ margin-top:9px; width:15px; height:15px; border:1.5px solid var(--ink-faint); border-radius:4px; flex-shrink:0; cursor:pointer; }
.step-row .step-check.checked{ background:var(--accent); border-color:var(--accent); }
.step-row .step-fields{ flex:1; display:flex; flex-direction:column; gap:4px; }
.step-row .step-fields .step-date{ font-size:11px; color:var(--ink-faint); }
.step-row input[type=text]{ border:1px solid var(--line); border-radius:5px; padding:5px 7px; font-size:13px; }
.tpl-step-edit{ display:flex; gap:6px; align-items:center; padding:5px 0; }
.tpl-step-edit input[type=number]{ width:70px; border:1px solid var(--line); border-radius:5px; padding:5px 6px; font-size:12px; }
.tpl-step-edit input[type=text]{ flex:1; border:1px solid var(--line); border-radius:5px; padding:5px 8px; font-size:12.5px; }
.tpl-step-edit button{ border:none; color:var(--ink-faint); font-size:15px; }

.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 18px; border-radius:20px; font-size:12.5px; z-index:90; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show{ opacity:1; }
.loading-msg{ text-align:center; padding:80px 0; color:var(--ink-faint); }
</style>
</head>
<body>

<div class="mobile-topbar">
  <button class="ham" onclick="toggleSidebar()">☰</button>
  <div class="title" id="mobileTitle">Today</div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app-shell">
  <div class="sidebar" id="sidebar">
    <div class="logo">圖書室</div>
    <div class="search-mini"><input type="text" id="globalSearch" placeholder="搜尋…" onkeydown="if(event.key==='Enter')doSearch()"></div>
    <nav id="navPrimary"></nav>
    <div class="divider"></div>
    <nav id="navSecondary"></nav>
    <div class="foot">個人工作空間</div>
  </div>
  <div class="content" id="mainArea"><div class="loading-msg">載入中…</div></div>
</div>

<button class="fab" onclick="openQuickAdd()">＋ 新增工作</button>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   資料模型 / 儲存 / Migration
============================================================ */
const STORAGE_KEY = 'library-system-db-v1'; // 沿用既有 key，確保資料延續

/* ============================================================
   Google 試算表同步層（取代原本 Claude 環境提供的 window.storage）
   ------------------------------------------------------------
   這個檔案是「獨立部署版」，脫離 Claude 介面後不會再有內建的
   window.storage 功能，所以這裡自己實作一份行為相同的版本，
   實際資料讀寫透過 fetch 呼叫你部署的 Google Apps Script 網址。
============================================================ */
const SyncConfig = {
  getUrl(){ return localStorage.getItem('libSyncUrl') || ''; },
  setUrl(url){ localStorage.setItem('libSyncUrl', (url||'').trim()); },
  clear(){ localStorage.removeItem('libSyncUrl'); }
};

async function pingSyncUrl(url){
  const res = await fetch(`${url}${url.includes('?')?'&':'?'}action=ping`, { method:'GET' });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || '連線失敗');
  return true;
}

window.storage = {
  async get(key, shared){
    const url = SyncConfig.getUrl();
    if(!url) throw new Error('尚未設定 Google 試算表同步網址');
    const res = await fetch(`${url}${url.includes('?')?'&':'?'}action=get&key=${encodeURIComponent(key)}`, { method:'GET' });
    if(!res.ok) throw new Error('網路請求失敗（HTTP '+res.status+'）');
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || '讀取失敗');
    if(data.value === null || data.value === undefined || data.value === '') return null;
    return { key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared){
    const url = SyncConfig.getUrl();
    if(!url) throw new Error('尚未設定 Google 試算表同步網址');
    // 用 text/plain 避免瀏覽器對 Apps Script 發出 CORS 預檢請求（Apps Script 不支援預檢）
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'set', key, value })
    });
    if(!res.ok) throw new Error('網路請求失敗（HTTP '+res.status+'）');
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || '儲存失敗');
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    const url = SyncConfig.getUrl();
    if(!url) throw new Error('尚未設定 Google 試算表同步網址');
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'delete', key })
    });
    const data = await res.json();
    return { key, deleted: !!(data&&data.ok), shared: !!shared };
  }
};
const DEFAULT_CATEGORY_NAMES = ["圖書借閱系統","圖書館館場佈置","資媒組","自主學習","高中優質化","教師研習","SEL計畫執行","閱讀推廣","圖書館會議","主管會議資料"];
const STATUS_LABELS = { inbox:'收件匣', scheduled:'已排程', doing:'進行中', waiting:'等待他人', checking:'待確認', done:'完成', archived:'已歸檔' };
const PRIO_LABELS = { high:'高', mid:'中', low:'低' };
const IMPACT_LABELS = { high:'高影響', medium:'中影響', low:'低影響' };

let DB = null;
let currentTab = 'today';
let saveTimer = null;

function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysDiff(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'); const t=new Date(todayStr()+'T00:00:00'); return Math.round((d-t)/86400000); }
function daysBetweenDates(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }
function fmtDate(d){ return d ? d.slice(5).replace('-','/') : ''; }
function addDaysToDate(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function computeAcademicYear(dateStr){
  const d = dateStr ? new Date(dateStr+'T00:00:00') : new Date();
  const y = d.getFullYear(), m = d.getMonth()+1;
  const startYear = m>=8 ? y : y-1;
  const roc = startYear - 1911;
  const term = (m>=8 || m<=1) ? 1 : 2;
  return `${roc}-${term}`;
}

async function loadDB(){
  let fetchFailed = false;
  let raw = null;
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    raw = res ? res.value : null;
  }catch(e){
    // 網路／連線錯誤：絕對不能當成「還沒有資料」，否則會誤蓋掉遠端既有資料
    fetchFailed = true;
    console.error('loadDB fetch error', e);
  }
  if(fetchFailed){
    DB = null; // 讓 init() 顯示錯誤畫面，不建立、不寫入任何東西
    return;
  }
  DB = raw ? JSON.parse(raw) : null;
  if(!DB){
    // 這裡確定是「試算表真的是空的」，才視為全新安裝並寫入初始資料
    DB = { categories:[], tasks:[], projects:[], meetings:[], results:[], events:[], schoolEvents:[], prepTemplates:[], reviews:[] };
    seedFreshInstall();
    await persist();
    return;
  }
  migrateDB();
}

function migrateDB(){
  ['tasks','projects','meetings','results','events','reviews','categories'].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
  if(!DB.schoolEvents) DB.schoolEvents = [];
  if(!DB.prepTemplates) DB.prepTemplates = [];

  // 1) categories: string[] -> {id,name,archived,order}[]
  if(DB.categories.length && typeof DB.categories[0] === 'string'){
    DB.categories = DB.categories.map((name,i)=>({ id:uid('cat'), name, archived:false, order:i }));
  }
  if(!DB.categories.length){
    DB.categories = DEFAULT_CATEGORY_NAMES.map((name,i)=>({ id:uid('cat'), name, archived:false, order:i }));
  }
  const nameToId = {};
  DB.categories.forEach(c=>{ nameToId[c.name]=c.id; });
  function resolveCat(name){
    if(!name) return '';
    if(nameToId[name]) return nameToId[name];
    const nc = { id:uid('cat'), name, archived:false, order:DB.categories.length };
    DB.categories.push(nc); nameToId[name]=nc.id; return nc.id;
  }
  // 2) migrate category(string) -> categoryId on all entities; add academicYear if missing
  ['tasks','projects','meetings','results','events'].forEach(coll=>{
    DB[coll].forEach(item=>{
      if(!item.categoryId && item.category){ item.categoryId = resolveCat(item.category); }
      if(item.academicYear===undefined) item.academicYear = computeAcademicYear(item.createdAt||item.date||item.startDate||item.dueDate||todayStr());
    });
  });
  DB.tasks.forEach(t=>{ if(t.eventId===undefined) t.eventId=''; });
  DB.events.forEach(e=>{
    if(e.endDate===undefined) e.endDate='';
    if(e.templateId===undefined) e.templateId='';
    if(e.relatedProjectId===undefined) e.relatedProjectId = e.projectId||'';
  });
  if(!DB.prepTemplates.length) seedPrepTemplates();
  if(!DB.schoolEvents.length) seedSchoolEvents();
}

function catName(id){ if(!id) return ''; const c=DB.categories.find(x=>x.id===id); return c? c.name : ''; }
function activeCategories(){ return DB.categories.filter(c=>!c.archived).sort((a,b)=>a.order-b.order); }
function catOptionsHtml(selectedId){
  return `<option value="">未分類</option>` + activeCategories().map(c=>`<option value="${c.id}" ${selectedId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
}

async function persist(){
  clearTimeout(saveTimer);
  return new Promise(resolve=>{
    saveTimer = setTimeout(async ()=>{
      try{
        const r = await window.storage.set(STORAGE_KEY, JSON.stringify(DB), false);
        if(!r) toast('⚠ 儲存失敗，請檢查網路連線');
      }
      catch(e){
        console.error('storage error', e);
        toast('⚠ 儲存失敗：'+e.message);
      }
      resolve();
    }, 150);
  });
}

/* ============================================================
   衍生資料
============================================================ */
function activeTasks(){ return DB.tasks.filter(t=>t.status!=='archived'); }
function isOverdue(t){ if(t.status==='done'||t.status==='archived') return false; if(!t.dueDate) return false; return daysDiff(t.dueDate) < 0; }
function isDueSoon(t, days=3){ if(t.status==='done'||t.status==='archived') return false; if(!t.dueDate) return false; const dd=daysDiff(t.dueDate); return dd>=0 && dd<=days; }
function projectProgressDisplay(p){
  if(p.progressOverride !== undefined && p.progressOverride !== null && p.progressOverride !== '') return p.progressOverride;
  const related = DB.tasks.filter(t=>t.projectId===p.id && t.status!=='archived');
  if(!related.length) return p.progress||0;
  return Math.round(related.filter(t=>t.status==='done').length/related.length*100);
}
function eventDate(e){ return e.startDate || e.date; }
function upcomingMyEvents(withinDays){
  return DB.events.filter(e=>{ const dd=daysDiff(eventDate(e)); return dd!==null && dd>=0 && dd<=withinDays; })
    .sort((a,b)=> daysDiff(eventDate(a)) - daysDiff(eventDate(b)));
}
function checkConflicts(startDate, endDate, excludeId){
  if(!startDate) return [];
  const s = startDate, e = endDate || startDate;
  const warnings = [];
  DB.schoolEvents.forEach(se=>{
    const seS = se.startDate, seE = se.endDate || se.startDate;
    const overlap = !(e < seS || s > seE);
    if(overlap){
      warnings.push({ level:'high', text:`與學校行事曆「${se.title}」（${fmtDate(seS)}${seE!==seS?'–'+fmtDate(seE):''}）撞期` });
    } else if(se.impactLevel==='high'){
      if(daysBetweenDates(seE, s)===1) warnings.push({ level:'mild', text:`安排在「${se.title}」隔天，可能互相影響` });
      if(daysBetweenDates(e, seS)===1) warnings.push({ level:'mild', text:`「${se.title}」在此活動隔天，可能互相影響` });
    }
  });
  return warnings;
}
function eventHasTasks(eventId){ return DB.tasks.some(t=>t.eventId===eventId && t.status!=='archived'); }
function prepSuggestions(withinDays=45){
  return DB.events.filter(e=>{
    if(!e.templateId) return false;
    if(eventHasTasks(e.id)) return false;
    const dd = daysDiff(eventDate(e));
    return dd!==null && dd>=0 && dd<=withinDays;
  }).sort((a,b)=> daysDiff(eventDate(a)) - daysDiff(eventDate(b)));
}

function taskRowHtml(t, opts={}){
  const over = isOverdue(t);
  const soon = !over && isDueSoon(t);
  let metaText = '';
  if(t.status==='waiting') metaText = '等待 · ' + (t.waitingFor||'');
  else if(t.dueDate) metaText = (over?'已逾期 ':'') + fmtDate(t.dueDate);
  else if(t.scheduledDate) metaText = fmtDate(t.scheduledDate);
  const metaCls = over ? 'overdue' : (soon ? 'soon' : '');
  const cName = catName(t.categoryId);
  return `
  <div class="task-row" onclick="openTaskDrawer('${t.id}')">
    <div class="task-check ${t.status==='done'?'checked':''}" onclick="event.stopPropagation();quickComplete('${t.id}')">${t.status==='done'?'✓':''}</div>
    <div class="task-main">
      <div class="task-title ${t.status==='done'?'done':''}">${escapeHtml(t.title)}</div>
      ${opts.showCat!==false && cName ? `<div class="task-sub">${escapeHtml(cName)}</div>` : ''}
    </div>
    ${metaText? `<div class="task-meta ${metaCls}">${metaText}</div>`:''}
    <div class="row-actions">
      ${t.status!=='doing'?`<button title="開始進行" onclick="event.stopPropagation();quickSetStatus('${t.id}','doing')">→</button>`:''}
      <button title="延期" onclick="event.stopPropagation();quickDefer('${t.id}')">⏵</button>
      ${t.status!=='waiting'?`<button title="等待他人" onclick="event.stopPropagation();quickSetStatus('${t.id}','waiting')">⋯</button>`:''}
    </div>
  </div>`;
}
async function quickComplete(id){
  const t = DB.tasks.find(x=>x.id===id); if(!t) return;
  t.status = t.status==='done' ? 'scheduled' : 'done';
  if(t.status==='done') t.completedDate = todayStr();
  await persist(); renderMain();
}
async function quickSetStatus(id, status){
  const t = DB.tasks.find(x=>x.id===id); if(!t) return;
  t.status = status;
  if(status==='waiting' && !t.waitingStart) t.waitingStart = todayStr();
  await persist(); renderMain();
}
async function quickDefer(id){
  const t = DB.tasks.find(x=>x.id===id); if(!t) return;
  const base = t.scheduledDate || todayStr();
  t.scheduledDate = addDaysToDate(base, 1);
  await persist(); renderMain(); toast('已延到明天');
}
async function deleteTask(id){

  DB.tasks = DB.tasks.filter(t=>t.id!==id);
  await persist(); closeDrawer(); renderMain(); toast('已刪除');
}

/* ============================================================
   Today
============================================================ */
function viewToday(){
  const t = todayStr();
  const tasks = activeTasks();
  const todayList = tasks.filter(x=> x.status!=='done' && (
    x.scheduledDate===t || x.dueDate===t || x.isToday || (x.status==='waiting' && x.waitingFollowUp===t)
  ));
  const overdue = tasks.filter(isOverdue);
  const dueSoon = tasks.filter(x=>isDueSoon(x,2) && !isOverdue(x) && x.dueDate!==t);
  const followToday = tasks.filter(x=>x.status==='waiting' && x.waitingFollowUp===t);
  const staleProjects = DB.projects.filter(p=>{
    if(p.status==='done') return false;
    const rel = DB.tasks.filter(x=>x.projectId===p.id);
    const last = rel.reduce((acc,x)=> !acc || (x.scheduledDate||x.createdAt) > acc ? (x.scheduledDate||x.createdAt) : acc, p.startDate);
    return daysDiff(last)!==null && daysDiff(last) <= -14;
  });
  const nearConflicts = upcomingMyEvents(14).map(e=>({e, warns:checkConflicts(e.startDate||e.date, e.endDate)})).filter(x=>x.warns.length);

  const attentionLines = [];
  overdue.forEach(x=>attentionLines.push({t:x, cls:'urgent', txt:`${x.title} 已逾期`}));
  dueSoon.forEach(x=>attentionLines.push({t:x, cls:'warn', txt:`${x.title} 即將截止（${fmtDate(x.dueDate)}）`}));
  followToday.forEach(x=>attentionLines.push({t:x, cls:'warn', txt:`${x.waitingFor||'對方'} 的「${x.title}」今天需要追蹤`}));
  staleProjects.forEach(p=>attentionLines.push({p, cls:'warn', txt:`專案「${p.name}」超過 14 天沒有更新`}));
  nearConflicts.forEach(({e,warns})=>warns.forEach(w=>attentionLines.push({e, cls:w.level==='high'?'urgent':'warn', txt:`「${e.title}」${w.text}`})));

  // 接下來：即將發生的活動 + 準備建議
  const events = upcomingMyEvents(45).slice(0,5);
  const prepIds = new Set(prepSuggestions(45).map(e=>e.id));

  const count = todayList.length;
  const followCount = followToday.length;
  let summary = count===0 ? '今天沒有排定的工作，找點想推進的事情吧。' : `今天有 ${count} 件事情值得處理`;
  if(count>0 && followCount>0) summary += `，${followCount} 件事情需要追蹤。`;
  else if(count>0) summary += '。';

  return `
  <div class="page-title">${new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'})}</div>
  <div class="page-sub">${summary}</div>

  <div class="section-label">今天</div>
  <div class="list-plain">
    ${todayList.length? todayList.sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')).map(x=>taskRowHtml(x)).join('') : '<div class="empty-note">沒有安排 — 到 Inbox 或 Tasks 找點事情來做，或享受空檔。</div>'}
  </div>

  ${attentionLines.length ? `
  <div class="section-label">需要注意</div>
  <div class="list-plain">
    ${attentionLines.map(a=>`
      <div class="attn-line ${a.cls}" onclick="${a.t?`openTaskDrawer('${a.t.id}')`:(a.p?`openProjectDrawer('${a.p.id}')`:(a.e?`openEventModal('${a.e.id}')`:''))}">
        <span class="mk">${a.cls==='urgent'?'⚠':'↗'}</span>${escapeHtml(a.txt)}
      </div>`).join('')}
  </div>` : ''}

  <div class="section-label">接下來需要準備 <button class="link-btn" style="margin-left:8px;" onclick="switchTab('calendar')">查看全部</button></div>
  <div class="list-plain">
    ${events.length ? events.map(e=>{
      const dd = daysDiff(eventDate(e));
      const isPrep = prepIds.has(e.id);
      const tpl = DB.prepTemplates.find(x=>x.id===e.templateId);
      let subText = `${fmtDate(eventDate(e))} · 還有 ${dd} 天`;
      if(isPrep && tpl) subText += ` · 依「${escapeHtml(tpl.name)}」範本建議這段時間開始準備`;
      else if(e.templateId && eventHasTasks(e.id)) subText += ` · 準備工作已建立`;
      return `
      <div class="up-row">
        <div class="up-main" onclick="openEventModal('${e.id}')">
          <div class="up-title">${escapeHtml(e.title)}</div>
          <div class="up-sub ${isPrep?'prep':''}">${subText}</div>
        </div>
        ${isPrep ? `<div class="up-action"><button onclick="openPrepModal('${e.id}')">開始準備</button></div>` : ''}
      </div>`;
    }).join('') : '<div class="empty-note">未來 45 天內沒有排定的活動</div>'}
  </div>
  `;
}

async function saveProjectModal(id){

async function deleteProject(id){
  if(!(await customConfirm('確定刪除此專案？（底下的工作不會被刪除，但會取消關聯）'))) return;
  DB.projects = DB.projects.filter(p=>p.id!==id);
  DB.tasks.forEach(t=>{ if(t.projectId===id) t.projectId=''; });
  await persist(); closeDrawer(); renderMain(); toast('已刪除');
}

/* ============================================================
   Calendar（月曆 + 學期雷達，含 My/School 雙層）
============================================================ */
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calShowMine = true, calShowSchool = true;
let calViewMode = 'month';
function viewCalendar(){
  return `
  <div class="page-title">Calendar</div>
  <div class="page-sub">事情什麼時候發生（Event），以及為此要做什麼（Task）</div>
  <div class="segmented">
    <button class="${calViewMode==='month'?'active':''}" onclick="calViewMode='month';renderMain()">月曆</button>
    <button class="${calViewMode==='semester'?'active':''}" onclick="calViewMode='semester';renderMain()">學期雷達</button>
  </div>
  <div class="cal-toggles" style="margin-top:14px;">
    <label><input type="checkbox" ${calShowMine?'checked':''} onchange="calShowMine=this.checked;renderMain()"> 我的活動</label>
    <label><input type="checkbox" ${calShowSchool?'checked':''} onchange="calShowSchool=this.checked;renderMain()"> 學校行事曆</label>
  </div>
  ${calViewMode==='month' ? `
    <div class="cal-head">
      <button class="cal-nav" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderMain()">← 上個月</button>
      <div style="font-size:14px;font-weight:600;">${calYear} / ${calMonth+1}</div>
      <button class="cal-nav" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderMain()">下個月 →</button>
    </div>
    <div id="calGridWrap"></div>
    <div id="calDayDetail" style="margin-top:20px;"></div>
    <div style="margin-top:18px;"><button class="btn" onclick="openEventModal(null)">＋ 新增活動</button></div>
  ` : renderSemesterView()}
  `;
}
function renderCalendarGrid(){
  const wrap = document.getElementById('calGridWrap'); if(!wrap) return;
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  const t = todayStr();
  const dow = ['日','一','二','三','四','五','六'];
  let html = `<div class="cal-grid">` + dow.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  cells.forEach(d=>{
    if(d===null){ html += `<div class="cal-cell other"></div>`; return; }
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs = calShowMine ? DB.events.filter(e=>{ const s=eventDate(e), en=e.endDate||s; return dateStr>=s && dateStr<=en; }) : [];
    const ses = calShowSchool ? DB.schoolEvents.filter(e=>{ const en=e.endDate||e.startDate; return dateStr>=e.startDate && dateStr<=en; }) : [];
    const tks = DB.tasks.filter(x=>(x.dueDate===dateStr||x.scheduledDate===dateStr) && x.status!=='archived' && x.status!=='done');
    const hasConflict = evs.some(e=>checkConflicts(eventDate(e), e.endDate).length>0);
    html += `<div class="cal-cell ${dateStr===t?'today':''} ${hasConflict?'conflict':''}" onclick="showCalDay('${dateStr}')">
      <div class="d-num">${d}</div>
      ${evs.slice(0,2).map(e=>`<div class="cal-item-txt"><span class="cal-dot ev"></span>${escapeHtml(e.title)}</div>`).join('')}
      ${ses.slice(0,2).map(e=>`<div class="cal-item-txt school"><span class="cal-dot school"></span>${escapeHtml(e.title)}</div>`).join('')}
      ${tks.slice(0,2).map(x=>`<div class="cal-item-txt"><span class="cal-dot"></span>${escapeHtml(x.title)}</div>`).join('')}
    </div>`;
  });
  html += `</div>`;
  wrap.innerHTML = html;
}
function showCalDay(dateStr){
  const evs = DB.events.filter(e=>{ const s=eventDate(e), en=e.endDate||s; return dateStr>=s && dateStr<=en; });
  const ses = DB.schoolEvents.filter(e=>{ const en=e.endDate||e.startDate; return dateStr>=e.startDate && dateStr<=en; });
  const tks = DB.tasks.filter(x=>(x.dueDate===dateStr||x.scheduledDate===dateStr) && x.status!=='archived');
  document.getElementById('calDayDetail').innerHTML = `
    <div class="section-label">${dateStr}</div>
    <div class="list-plain">
      ${evs.map(e=>{
        const warns = checkConflicts(eventDate(e), e.endDate);
        return `<div class="task-row" onclick="openEventModal('${e.id}')">
          <div class="task-main"><div class="task-title">${escapeHtml(e.title)}</div><div class="task-sub">${escapeHtml(catName(e.categoryId))}${warns.length?' · ⚠ 撞期':''}</div></div>
        </div>`;
      }).join('')}
      ${ses.map(e=>`<div class="task-row"><div class="task-main"><div class="task-title">${escapeHtml(e.title)}<span class="impact-badge ${e.impactLevel}">${IMPACT_LABELS[e.impactLevel]||''}</span></div><div class="task-sub">學校行事曆</div></div></div>`).join('')}
      ${tks.map(x=>taskRowHtml(x)).join('')}
      ${(!evs.length && !ses.length && !tks.length)?'<div class="empty-note">這天沒有排定事項</div>':''}
    </div>`;
}
function renderSemesterView(){
  const year = computeAcademicYear();
  const now = new Date();
  const months = [];
  for(let i=0;i<12;i++){ const d=new Date(now.getFullYear(), now.getMonth()+i, 1); months.push(d); }
  const html = months.map(mDate=>{
    const y = mDate.getFullYear(), m = mDate.getMonth();
    const monthStart = `${y}-${String(m+1).padStart(2,'0')}-01`;
    const monthEnd = `${y}-${String(m+1).padStart(2,'0')}-31`;
    const evs = calShowMine ? DB.events.filter(e=>{ const s=eventDate(e); return s>=monthStart && s<=monthEnd; }) : [];
    const ses = calShowSchool ? DB.schoolEvents.filter(e=>e.startDate>=monthStart && e.startDate<=monthEnd) : [];
    if(!evs.length && !ses.length) return '';
    const lines = [
      ...evs.map(e=>{ const warns=checkConflicts(eventDate(e),e.endDate); return {txt:`${fmtDate(eventDate(e))} ${e.title}`, cls: warns.length?'conflict':'mine', id:e.id, isMine:true}; }),
      ...ses.map(e=>({txt:`${fmtDate(e.startDate)} ${e.title}（學校）`, cls:'school', id:e.id, isMine:false}))
    ].sort((a,b)=>a.txt.localeCompare(b.txt));
    return `<div class="sem-month"><h3>${y} 年 ${m+1} 月</h3>
      ${lines.map(l=>`<div class="sem-line ${l.cls}" style="cursor:pointer;" onclick="${l.isMine?`openEventModal('${l.id}')`:''}">${escapeHtml(l.txt)}</div>`).join('')}
    </div>`;
  }).join('');
  return `<div>${html || '<div class="empty-note">未來 12 個月內沒有排定的活動</div>'}</div>`;
}

/* ============================================================
   Preparation Radar Modal
============================================================ */
function openPrepModal(eventId){
  const e = DB.events.find(x=>x.id===eventId); if(!e) return;
  const tpl = DB.prepTemplates.find(x=>x.id===e.templateId);
  if(!tpl){ toast('這個活動尚未設定準備範本'); return; }
  const steps = tpl.steps.slice().sort((a,b)=>a.offset-b.offset).map(s=>({...s, date: addDaysToDate(eventDate(e), s.offset)}));
  openModal(`
    <h2>${escapeHtml(e.title)} — 建議準備工作</h2>
    <div class="task-sub" style="margin-bottom:14px;">依「${escapeHtml(tpl.name)}」範本計算，活動日期 ${fmtDate(eventDate(e))}</div>
    <div id="prepStepsArea">
      ${steps.map((s,i)=>`
        <div class="step-row">
          <div class="step-check checked" data-idx="${i}" onclick="this.classList.toggle('checked')"></div>
          <div class="step-fields">
            <input type="text" value="${escapeHtml(s.title)}" data-idx="${i}" class="prep-title-input">
            <div class="step-date">${s.date}（${s.offset<0?s.offset+' 天':'+'+s.offset+' 天'}）</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">稍後處理</button>
      <button class="btn primary" onclick='createPrepTasks("${eventId}", ${JSON.stringify(steps).replace(/'/g,"&#39;")})'>建立所選工作</button>
    </div>
  `);
}
async function createPrepTasks(eventId, stepsJson){
  const e = DB.events.find(x=>x.id===eventId); if(!e) return;
  const steps = typeof stepsJson==='string' ? JSON.parse(stepsJson) : stepsJson;
  const checks = document.querySelectorAll('#prepStepsArea .step-check');
  const titleInputs = document.querySelectorAll('#prepStepsArea .prep-title-input');
  let count = 0;
  checks.forEach((chk, i)=>{
    if(chk.classList.contains('checked')){
      const title = titleInputs[i].value.trim() || steps[i].title;
      DB.tasks.push({ id:uid('t'), title, categoryId:e.categoryId||'', projectId:e.relatedProjectId||'', eventId:e.id,
        status:'scheduled', priority:'mid', createdAt:todayStr(), scheduledDate:'', dueDate:steps[i].date,
        completedDate:'', nextAction:'', notes:'源自活動：'+e.title, isToday:false, academicYear:e.academicYear||computeAcademicYear() });
      count++;
    }
  });
  await persist(); closeModal(); renderMain();
  toast(`已建立 ${count} 項準備工作`);
}

  <div class="review-block"><h3>有活動該開始準備了嗎？</h3><div class="rb-sub">${prepReady.length} 個</div>
    <div class="list-plain">${prepReady.map(e=>`
      <div class="up-row"><div class="up-main" onclick="openEventModal('${e.id}')"><div class="up-title">${escapeHtml(e.title)}</div><div class="up-sub prep">還有 ${daysDiff(eventDate(e))} 天</div></div>

  <div class="review-block"><h3>每個進行中專案的下一步？</h3>
    <div class="list-plain">${doingProjects.map(p=>`
      <div class="task-row" onclick="openProjectDrawer('${p.id}')">

async function testAndSaveSyncUrl(){
  const url = document.getElementById('syncUrlInput').value.trim();
  const status = document.getElementById('syncTestStatus');
  if(!url){ status.textContent='請輸入網址'; status.style.color='var(--red)'; return; }
  status.textContent='連線測試中…'; status.style.color='var(--ink-faint)';
  try{
    await pingSyncUrl(url);
    SyncConfig.setUrl(url);
    status.textContent='連線成功，已儲存'; status.style.color='var(--accent-deep)';
    toast('已更新同步設定');
  }catch(e){
    status.textContent='連線失敗：'+e.message; status.style.color='var(--red)';
  }

async function importJsonFile(){
  const fileInput = document.getElementById('importJsonFile');
  const file = fileInput.files[0];
  if(!file){ toast('請先選擇檔案'); return; }
  if(!(await customConfirm('確定要用這個檔案覆蓋目前所有資料嗎？這個動作無法復原。'))) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.tasks)){
      toast('這個檔案格式看起來不對，請確認是系統匯出的 JSON 備份');
      return;
    }
    DB = parsed;
    migrateDB();
    await persist();
    renderMain();
    toast('匯入完成');
  }catch(e){
    toast('匯入失敗：'+e.message);
  }
}

  const v = el.value.trim();

async function renameCategory(id){
  const c = DB.categories.find(x=>x.id===id); if(!c) return;
  const nv = await customPrompt('重新命名「'+c.name+'」為：', c.name);
  if(!nv || nv===c.name) return;
  c.name = nv; await persist(); renderMain(); toast('已更新');
}
async function toggleArchiveCategory(id){
  const c = DB.categories.find(x=>x.id===id); if(!c) return;
  c.archived = !c.archived; await persist(); renderMain();
}
async function moveCategory(id, dir){
  const list = DB.categories.slice().sort((a,b)=>a.order-b.order);
  const idx = list.findIndex(c=>c.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=list.length) return;
  const a=list[idx], b=list[swapIdx];
  const tmp=a.order; a.order=b.order; b.order=tmp;
  await persist(); renderMain();
}
function mergeCategory(id){
  const c = DB.categories.find(x=>x.id===id); if(!c) return;
  const others = DB.categories.filter(x=>x.id!==id);
  if(!others.length){ toast('沒有其他分類可以合併'); return; }
  openModal(`
    <h2>將「${escapeHtml(c.name)}」合併到…</h2>
    <div class="empty-note" style="margin-bottom:10px;">選一個目標分類，「${escapeHtml(c.name)}」底下所有資料會轉移過去，原分類會被刪除。</div>
    <div class="list-plain">
      ${others.map(o=>`<div class="settings-row" style="cursor:pointer;" onclick="doMergeCategory('${id}','${o.id}')"><span>${escapeHtml(o.name)}${o.archived?'（已封存）':''}</span><span>→</span></div>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button></div>
  `);
}
async function doMergeCategory(id, targetId){
  const target = DB.categories.find(x=>x.id===targetId); if(!target) return;
  ['tasks','projects','meetings','results','events'].forEach(coll=>{
    DB[coll].forEach(item=>{ if(item.categoryId===id) item.categoryId=targetId; });
  });
  DB.categories = DB.categories.filter(x=>x.id!==id);
  await persist(); closeModal(); renderMain(); toast(`已合併到「${target.name}」`);
}

async function saveTemplateEditor(id){
  const name = document.getElementById('tpl-name').value.trim();
  if(!name){ toast('請輸入範本名稱'); return; }
  const rows = document.querySelectorAll('#tplStepsArea .tpl-step-edit');
  const steps = Array.from(rows).map(r=>({ id:uid('st'), offset:Number(r.querySelector('.tpl-offset').value)||0, title:r.querySelector('.tpl-title').value.trim() })).filter(s=>s.title);

  else DB.prepTemplates.push({ id:uid('tpl'), name, steps });

async function deleteTemplate(id){

  DB.events.forEach(e=>{ if(e.templateId===id) e.templateId=''; });
  await persist(); closeModal(); renderMain(); toast('已刪除');
}

async function addSchoolEvent(){

  DB.schoolEvents.push({ id:uid('se'), title, startDate:start, endDate:document.getElementById('se-end').value||'', type:document.getElementById('se-type').value, impactLevel:document.getElementById('se-impact').value, source:'手動輸入' });
  await persist(); renderMain(); toast('已新增');

async function bulkAddSchoolEvents(){
  const raw = document.getElementById('seBulkInput').value.trim();
  if(!raw) return;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let count = 0;
  lines.forEach(line=>{
    const parts = line.split(',').map(s=>s.trim());
    if(parts.length<2) return;
    const [title, startDate, endDate, type, impactLevel] = parts;
    if(!title||!startDate) return;
    DB.schoolEvents.push({ id:uid('se'), title, startDate, endDate:endDate||'', type:type||'', impactLevel:impactLevel||'medium', source:'批次匯入' });
    count++;
  });
  await persist(); renderMain(); toast(`已匯入 ${count} 筆`);
}

function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportJSON(){ downloadBlob(JSON.stringify(DB,null,2), `library-system-backup-${todayStr()}.json`, 'application/json'); toast('已匯出 JSON'); }
function exportCSV(kind){
  const rows = DB[kind]||[];
  if(!rows.length){ toast('沒有資料可以匯出'); return; }
  const keys = Array.from(rows.reduce((s,r)=>{ Object.keys(r).forEach(k=>s.add(k)); return s;}, new Set()));
  const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = [keys.join(','), ...rows.map(r=>keys.map(k=>esc(r[k])).join(','))].join('\n');
  downloadBlob('\uFEFF'+csv, `${kind}-${todayStr()}.csv`, 'text/csv;charset=utf-8;');
  toast('已匯出 CSV');
}

function doSearch(){ doSearchWith(document.getElementById('globalSearch').value); }
function doSearchWith(qRaw){
  const q = (qRaw||'').trim().toLowerCase();
  if(!q) return;
  const inStr = (s)=> (s||'').toLowerCase().includes(q);
  const tasks = DB.tasks.filter(t=> inStr(t.title)||inStr(t.notes)||inStr(t.nextAction)||inStr(catName(t.categoryId)));
  const projects = DB.projects.filter(p=> inStr(p.name)||inStr(p.description)||inStr(catName(p.categoryId)));
  const meetings = DB.meetings.filter(m=> inStr(m.name)||inStr(m.discussion)||inStr(m.decisions)||inStr(m.followUps));
  const results = DB.results.filter(r=> inStr(r.title)||inStr(r.summary)||inStr(r.content));
  const events = DB.events.filter(e=> inStr(e.title));
  window._searchHtml = `
    <div class="page-title">搜尋</div>
    <div class="page-sub">「${escapeHtml(q)}」的結果</div>
    <div class="section-label">工作（${tasks.length}）</div>

    <div class="list-plain">${meetings.map(m=>`<div class="task-row" onclick="openMeetingModal('${m.id}')"><div class="task-main"><div class="task-title">${escapeHtml(m.name)}</div></div></div>`).join('')||'<div class="empty-note">無</div>'}</div>

/* 自訂確認／輸入對話框：取代原生 confirm()/prompt()，因為某些預覽環境會封鎖原生對話框 */
function customConfirm(message){
  return new Promise(resolve=>{
    openModal(`
      <h2>請確認</h2>
      <div style="font-size:13.5px;margin-bottom:18px;line-height:1.6;">${escapeHtml(message)}</div>
      <div class="modal-actions">
        <button class="btn" id="cc-cancel">取消</button>
        <button class="btn danger" id="cc-ok">確定</button>
      </div>
    `);
    document.getElementById('cc-cancel').onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById('cc-ok').onclick = ()=>{ closeModal(); resolve(true); };
  });
}
function customPrompt(message, defaultValue){
  return new Promise(resolve=>{
    openModal(`
      <h2>請輸入</h2>
      <div style="font-size:13.5px;margin-bottom:10px;line-height:1.6;">${escapeHtml(message)}</div>
      <input type="text" class="qa-input" id="cp-input" value="${escapeHtml(defaultValue||'')}">
      <div class="modal-actions">
        <button class="btn" id="cp-cancel">取消</button>
        <button class="btn primary" id="cp-ok">確定</button>
      </div>
    `);
    const input = document.getElementById('cp-input');
    setTimeout(()=>{ if(input){ input.focus(); input.select(); } }, 30);
    const finish = (val)=>{ closeModal(); resolve(val); };
    document.getElementById('cp-cancel').onclick = ()=> finish(null);
    document.getElementById('cp-ok').onclick = ()=> finish(input.value.trim());
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') finish(input.value.trim()); });
  });
}

function renderSetupScreen(){
  document.getElementById('mainArea').innerHTML = `
    <div class="page-title">連接你的 Google 試算表</div>
    <div class="page-sub">這個系統的資料會存在你自己的 Google 試算表裡。貼上部署後拿到的 Apps Script 網址即可開始使用。</div>

      <label>Apps Script 網頁應用程式網址（結尾是 /exec）</label>
      <input type="text" id="setupUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div id="setupStatus" class="empty-note" style="min-height:20px;"></div>
    <div style="margin-top:14px;"><button class="btn primary" onclick="submitSetupUrl()">測試連線並儲存</button></div>
    <div class="empty-note" style="margin-top:28px;max-width:480px;">還沒部署嗎？打開附上的「AppsScript-Code.gs」，依照「部署說明」文件的步驟操作，就能拿到這組網址。</div>
  `;
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerOverlay').classList.remove('show');
}
async function submitSetupUrl(){
  const input = document.getElementById('setupUrlInput');
  const url = input.value.trim();
  const status = document.getElementById('setupStatus');
  if(!url){ status.textContent = '請輸入網址'; status.style.color = 'var(--red)'; return; }
  status.textContent = '連線測試中…'; status.style.color = 'var(--ink-faint)';
  try{
    await pingSyncUrl(url);
    SyncConfig.setUrl(url);
    status.textContent = '連線成功，載入資料中…'; status.style.color = 'var(--accent-deep)';
    await bootApp();
  }catch(e){
    status.textContent = '連線失敗：'+e.message+'（請確認部署時「具有應用程式存取權的使用者」設為「任何人」）';
    status.style.color = 'var(--red)';
  }
}
function renderConnectionErrorScreen(){
  document.getElementById('mainArea').innerHTML = `
    <div class="page-title">連線失敗</div>
    <div class="page-sub">讀取 Google 試算表資料時發生錯誤，為了保護你既有的資料，系統不會建立新的空白資料。</div>
    <div class="empty-note" style="margin-bottom:16px;">請檢查網路連線，或確認 Apps Script 部署是否還有效，然後重試。</div>
    <button class="btn primary" onclick="bootApp()">重新嘗試連線</button>
    <button class="btn" style="margin-left:8px;" onclick="renderSetupScreen()">重新設定同步網址</button>
  `;
}
async function bootApp(){
  document.getElementById('mainArea').innerHTML = '<div class="loading-msg">載入中…</div>';
  await loadDB();
  if(DB === null){ renderConnectionErrorScreen(); return; }
  renderNav();
  renderMain();
}
