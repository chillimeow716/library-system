<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>圖書館工作系統</title>
<style>
:root{--ink:#37352f;--ink2:#787774;--ink3:#9b9a97;--line:#e9e9e7;--bg:#fff;--soft:#f7f7f5;--hover:#efefed;--accent:#2383e2;--red:#e03e3e;--nav-h:62px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.layout{display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding:14px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.hdr h1{font-size:22px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--ink2);background:#fff;white-space:nowrap}
.hbtn:hover{background:var(--hover)}
.back{font-size:13px;color:var(--ink2);margin-bottom:4px;display:inline-block}
.bnav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:20}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--ink3);min-width:0}
.bnav button.on{color:var(--ink);font-weight:600}
.ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico img{width:26px;height:26px;border-radius:6px;object-fit:cover}
.ico svg{width:21px;height:21px}
.sec{margin:20px 0 4px;font-size:13px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:6px}
.sec .n{font-weight:400;color:var(--ink3)}
.sec .sp{flex:1}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--soft)}
.row.static{cursor:default}
.row .body{flex:1;min-width:0}
.row .t{word-break:break-word}
.row .meta{font-size:12px;color:var(--ink2);margin-top:2px;display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.row .tm{font-size:13px;color:var(--ink2);width:44px;flex-shrink:0;padding-top:1px;font-variant-numeric:tabular-nums}
.chk{width:18px;height:18px;border:1.5px solid #c7c6c4;border-radius:4px;flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done .t{color:var(--ink3);text-decoration:line-through}
.tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:3px;line-height:20px;white-space:nowrap}
.late{color:var(--red)}
.empty{color:var(--ink3);font-size:13px;padding:10px 4px}
.qa{display:flex;gap:8px;margin-bottom:6px}
.qa input,.qa textarea{flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;background:#fff}
.btn{border:1px solid var(--line);border-radius:6px;padding:7px 12px;background:#fff;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:2px 8px;font-size:12.5px;font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink2);background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card .ch{display:flex;align-items:center;gap:8px;cursor:pointer}
.card .ch b{flex:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .v{font-size:21px;font-weight:700}
.stat .l{font-size:12px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;white-space:nowrap}
th{color:var(--ink2);font-weight:500}
.num{text-align:right;font-variant-numeric:tabular-nums}
.over{color:var(--red);font-weight:600}
.tw{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .h{font-size:12px;color:var(--ink2);text-align:center;padding:3px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .d{min-height:62px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px;cursor:pointer;overflow:hidden}
.cal .d.out{background:var(--soft);color:var(--ink3)}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .num{font-size:12px;text-align:left;padding-left:2px}
.cal .d.today .num span{background:var(--red);color:#fff;border-radius:999px;padding:0 5px}
.cal .it{font-size:10.5px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px;padding:0 2px;margin-top:1px}
.cal .more{font-size:10px;color:var(--ink3);padding-left:2px}
.k-ev{background:#d3e5ef}.k-pe{background:#f5e0e9}.k-sc{background:#e3e2e0}.k-ms{background:#fdecc8}.k-tk{background:#dbeddb}
.navrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.navrow .lbl{flex:1;text-align:center;font-weight:600}
.wk .day{border-bottom:1px solid var(--line);padding:8px 0}
.wk .dh{font-size:13px;font-weight:600;margin-bottom:2px}
.wk .dh.today{color:var(--red)}
.wk .row{padding:6px 2px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:320px}
.mini span{aspect-ratio:1;border-radius:4px;background:var(--soft);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.mini span.on{background:#6aa58f;color:#fff}
.mini span.blank{background:none}
.bar{height:8px;background:#6aa58f;border-radius:4px}
.ov{position:fixed;inset:0;background:rgba(15,15,15,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;margin:0 0 12px}
.f{margin-bottom:10px}
.f>label{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
.f textarea{min-height:60px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:6px 4px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .sp{flex:1}
.log{border-left:2px solid var(--line);padding-left:10px;margin:6px 0}
.log .li{font-size:13px;margin-bottom:5px;word-break:break-word}
.ld{font-size:11px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1;pointer-events:auto}
.toast button{color:#9cc7f5;margin-left:12px;font-weight:600}
.del{flex-shrink:0;color:var(--ink3);padding:2px 4px;margin-top:1px;border-radius:4px;line-height:0}
.del:hover{color:var(--red);background:var(--hover)}
.del svg{width:17px;height:17px}
.wk .del{display:none}
.center{max-width:440px;margin:12vh auto;padding:20px}
.ms{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.ms .md{color:var(--ink2);font-size:12px;white-space:nowrap;padding-top:2px}
.ms .chk{margin-top:2px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{padding:6px 0;color:var(--ink2);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.kan{display:grid;grid-template-columns:1fr;gap:8px}
.kan .col{background:var(--soft);border-radius:8px;padding:8px;min-width:0}
.kan .col h4{margin:0 0 6px;font-size:13px}
.kc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;margin-bottom:6px;cursor:pointer}
.note-text{white-space:pre-wrap;word-break:break-word}
.hint{font-size:12px;color:var(--ink3);margin:8px 0}
/* 自己排序 */
.row .grip{display:none;color:#c7c6c4;cursor:grab;padding-top:1px;font-size:14px;letter-spacing:-3px;user-select:none;flex-shrink:0}
.row .mv{display:none;flex-direction:column;gap:3px;flex-shrink:0}
.row .mv button{width:26px;height:20px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink2);font-size:10px;line-height:1;padding:0}
.sortl .row.dragging{opacity:.4}
@media(hover:hover) and (pointer:fine){.sortl .row .grip{display:block}}
@media(hover:none),(pointer:coarse){.sortl .row .mv{display:flex}}
@media(min-width:600px){.kan{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){
 .bnav{display:none}
 .side{display:block;width:232px;flex-shrink:0;background:var(--soft);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow:auto;padding:14px 8px}
 .side .brand{font-weight:700;padding:4px 8px 12px}
 .side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:5px;font-size:14px;color:var(--ink2)}
 .side button:hover{background:var(--hover)}
 .side button.on{background:var(--hover);color:var(--ink);font-weight:600}
 .side .ico,.side .ico img{width:22px;height:22px}
 .side .ico svg{width:18px;height:18px}
 .side .subs button{padding:3px 8px 3px 38px;font-size:13px}
 .side hr{border:0;border-top:1px solid var(--line);margin:10px 8px}
 .main{padding:28px 40px 48px}
 .ov{align-items:center}
 .sheet{border-radius:12px}
 .toast{bottom:24px}
 .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
 .wk .day{border-right:1px solid var(--line);padding:6px;min-height:180px}
 .wk .row{display:block;font-size:13px}
 .wk .row .tm{width:auto;display:block;font-size:12px}
 .wk .row .chk{display:none}
 .cal .d{min-height:96px}
}
</style>
</head>

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toD = s => new Date(s + 'T00:00:00');
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diff = s => Math.round((toD(s) - toD(today())) / 864e5);
const WD = '日一二三四五六';
const fmt = s => s ? `${+s.slice(5,7)}/${+s.slice(8,10)}` : '';
const fmtW = s => `${fmt(s)}（${WD[toD(s).getDay()]}）`;
const weekStart = s => { const d = toD(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
const money = n => (Math.round(+n || 0)).toLocaleString('zh-TW');
const clone = o => JSON.parse(JSON.stringify(o));
function toast(m, undo){ const t = $('#toast'); t.innerHTML = h(m) + (undo ? '<button data-act="undoDel">復原</button>' : ''); t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 1900); }
const DEL_BTN = (kind, id) => `<button class="del" data-act="quickDel" data-kind="${kind}" data-id="${id}" aria-label="刪除" title="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>`;
function rangeText(a, b){ return b && b !== a ? `${fmt(a)}–${fmt(b)}` : fmt(a); }

/* ---------- 與 Apps Script 溝通（與舊版相同的 API） ---------- */
const Sync = { url(){ return localStorage.getItem('libSyncUrl') || ''; }, set(u){ localStorage.setItem('libSyncUrl', (u || '').trim()); } };
const qs = u => u + (u.includes('?') ? '&' : '?');
async function apiGet(key){
  const u = Sync.url(); if(!u) throw new Error('尚未設定網址');
  const r = await fetch(qs(u) + 'action=get&key=' + encodeURIComponent(key));
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json(); if(!d.ok) throw new Error(d.error || '讀取失敗');
  return (d.value === null || d.value === undefined || d.value === '') ? null : d.value;
}
async function apiSet(key, value){
  const u = Sync.url();
  const r = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'set', key, value }) });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json(); if(!d.ok) throw new Error(d.error || '儲存失敗');
}
async function ping(u){ const r = await fetch(qs(u) + 'action=ping'); const d = await r.json(); if(!d.ok) throw new Error(d.error || '連線失敗'); }

let DB = null, lastRaw = null, saveT = null, pollT = null;

/* ---------- 自己排序：電腦拖曳、手機 ▲▼ ---------- */
const FINE = matchMedia('(hover:hover) and (pointer:fine)').matches;
const byOrd = (a, b) => { const ao = typeof a.order === 'number', bo = typeof b.order === 'number';
  if(ao && bo) return a.order - b.order; if(ao !== bo) return ao ? -1 : 1;
  return (a.dueDate || '9').localeCompare(b.dueDate || '9'); };
const sortList = (arr, opt) => `<div class="sortl">${arr.map(t => taskRow(t, Object.assign({ sort:true }, opt || {}))).join('')}</div>`;
function applyOrder(wrap){ [...wrap.children].filter(r => r.classList.contains('row')).forEach((r, i) => { const t = DB.tasks.find(x => x.id === r.dataset.id); if(t) t.order = i + 1; }); save(); render(); }
function moveTask(id, dir){ const r = document.querySelector('.sortl > .row[data-id="' + id + '"]'); if(!r) return;
  const sib = dir < 0 ? r.previousElementSibling : r.nextElementSibling; if(!sib) return;
  if(dir < 0) r.parentNode.insertBefore(r, sib); else r.parentNode.insertBefore(sib, r); applyOrder(r.parentNode); }
let dragEl = null;
document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('.sortl > .row'); if(!r) return; dragEl = r; r.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', r.dataset.id); });
document.addEventListener('dragover', e => { if(!dragEl) return; e.preventDefault(); const r = e.target.closest && e.target.closest('.sortl > .row'); if(!r || r === dragEl || r.parentNode !== dragEl.parentNode) return;
  const b = r.getBoundingClientRect(); r.parentNode.insertBefore(dragEl, (e.clientY - b.top) > b.height / 2 ? r.nextSibling : r); });
document.addEventListener('drop', e => { if(dragEl) e.preventDefault(); });
document.addEventListener('dragend', () => { if(!dragEl) return; const w = dragEl.parentNode; dragEl.classList.remove('dragging'); dragEl = null; applyOrder(w); });

function fix(){
  ['categories','tasks','events','plans','notes','exercise','schoolCal','trash'].forEach(k => { if(!Array.isArray(DB[k])) DB[k] = []; });
  if(!DB.budget) DB.budget = {};
  ['lines','expenses','otherFunds'].forEach(k => { if(!Array.isArray(DB.budget[k])) DB.budget[k] = []; });
  /* LINE 機器人寫進來的資料用的是舊格式，這裡補上新欄位 */
  const areaOf = id => { const c = DB.categories.find(x => x.id === id); return c ? c.area : ''; };
  DB.tasks.forEach(t => { t.log = t.log || []; t.links = t.links || [];
    if(!t.area) t.area = areaOf(t.categoryId) || 'work';
    if(!STATUS[t.status]) t.status = t.status === 'archived' ? 'done' : 'todo';
    if(!t.role) t.role = '承辦'; if(!t.nature) t.nature = 'single'; if(t.planId === undefined) t.planId = '';

    if(!e.type) e.type = '活動'; if(!e.startDate) e.startDate = e.date || today();
    if(!e.area) e.area = e.type === '個人行程' ? 'personal' : (areaOf(e.categoryId) || 'work');
    if(!e.categoryId){ const c = e.area === 'personal' ? DB.categories.find(x => x.area === 'personal' && x.name === '個人活動') : DB.categories.find(x => x.area === 'work' && x.name === e.type); if(c) e.categoryId = c.id; }

  DB.plans.forEach(p => { p.milestones = p.milestones || []; p.log = p.log || []; p.milestones.forEach(m => m.log = m.log || []); });
}

function hdr(title, opt){

}

/* ---------- 列 ---------- */
function taskRow(t, opt){
  opt = opt || {};
  const done = t.status === 'done';
  const d = t.dueDate ? diff(t.dueDate) : null;
  const late = !done && d !== null && d < 0;
  const p = t.planId ? planOf(t.planId) : null;
  const meta = [];
  if(!opt.noCat) meta.push(catTag(t.categoryId));
  if(t.status === 'doing') meta.push(tag('進行中', 1));
  if(t.status === 'waiting') meta.push(tag('等待中', 3) + (t.waitingFor ? ` ${h(t.waitingFor)}` : '') + (t.waitingSince ? ` · 已等 ${Math.max(0, -diff(t.waitingSince))} 天` : ''));
  if(t.dueDate) meta.push(`<span class="${late ? 'late' : ''}">${late ? '逾期 ' : ''}${fmtW(t.dueDate)}截止</span>`);
  if(t.area === 'work' && t.role === '參加') meta.push('參加');
  if(t.nature && t.nature !== 'single') meta.push(NATURES[t.nature]);
  if(p) meta.push('📁 ' + h(p.name));
  if(done && t.completedDate) meta.push(`${fmt(t.completedDate)} 完成`);
  return `<div class="row ${done ? 'done' : ''}" data-act="editTask" data-id="${t.id}"${opt.sort && FINE ? ' draggable="true"' : ''}>${opt.sort ? '<span class="grip" data-act="noop" title="拖曳排序">⋮⋮</span>' : ''}<button class="chk ${done ? 'on' : ''}" data-act="toggleTask" data-id="${t.id}" aria-label="完成"></button><div class="body"><div class="t">${h(t.title)}</div>${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}</div>${opt.sort ? `<span class="mv"><button data-act="mvUp" data-id="${t.id}" aria-label="上移">▲</button><button data-act="mvDn" data-id="${t.id}" aria-label="下移">▼</button></span>` : ''}${DEL_BTN('task', t.id)}</div>`;
}
function evMeta(e, showRange){
  const m = [];
  m.push(tag(e.type, e.type === '個人行程' ? 7 : 2));
  const c = cat(e.categoryId);
  if(c && c.name !== e.type && !(e.type === '個人行程' && c.name === '個人活動')) m.push(catTag(e.categoryId));
  if(e.area === 'work' && e.role === '承辦') m.push('承辦');
  if(showRange && e.endDate && e.endDate !== e.startDate) m.push(rangeText(e.startDate, e.endDate));
  if(e.location) m.push('📍' + h(e.location));
  return m.join('');
}
function agRow(it, opt){
  opt = opt || {};
  if(it.k === 'tk') return taskRow(it.x);
  if(it.k === 'ev'){ const e = it.x;
    return `<div class="row" data-act="editEvent" data-id="${e.id}"><span class="tm">${h((e.time || '').slice(0, 5))}</span><div class="body"><div class="t">${h(e.title)}</div><div class="meta">${evMeta(e, opt.range)}</div></div>${DEL_BTN('event', e.id)}</div>`; }
  if(it.k === 'ms'){ const m = it.x;
    return `<div class="row ${m.done ? 'done' : ''}" data-act="openPlan" data-id="${it.p.id}"><span class="tm"></span><div class="body"><div class="t">${h(m.title)}</div><div class="meta">${tag('里程碑', 3)}${h(it.p.name)}${m.mode === 'remind' ? ' · 只提醒' : ''}</div></div></div>`; }
  if(it.k === 'sc'){ const s = it.x;
    return `<div class="row static"><span class="tm"></span><div class="body"><div class="t ${s.tag ? 'late' : ''}">${h(s.title)}</div><div class="meta">${tag('校曆', 0)}${h(s.source)}${s.tag ? ' · ' + h(s.tag) : ''}${opt.range && s.endDate && s.endDate !== s.startDate ? ' · ' + rangeText(s.startDate, s.endDate) : ''}</div></div></div>`; }
  return '';
}
/* 某一天的所有項目 f: all / work / personal / school */
function dayItems(d, f, withTasks){
  const out = [];
  if(f !== 'school'){
    DB.events.forEach(e => { if(onDay(e, d) && (f === 'all' || e.area === f)) out.push({ k:'ev', x:e, t:e.time || '', s:e.startDate }); });
    if(f === 'all' || f === 'work') DB.plans.forEach(p => p.milestones.forEach(m => { if(m.date === d) out.push({ k:'ms', x:m, p, t:'', s:d }); }));
    if(withTasks) DB.tasks.forEach(t => { if(t.status !== 'done' && t.dueDate === d && (f === 'all' || t.area === f)) out.push({ k:'tk', x:t, t:'', s:d }); });
  }
  if(f === 'all' || f === 'school') DB.schoolCal.forEach(s => { if(s.startDate <= d && d <= (s.endDate || s.startDate)) out.push({ k:'sc', x:s, t:'', s:s.startDate }); });
  const rank = { ev:0, ms:1, tk:2, sc:3 };
  out.sort((a, b) => (a.t || '99').localeCompare(b.t || '99') || rank[a.k] - rank[b.k]);
  return out;
}
function dayLabel(d){ const n = diff(d); return fmtW(d) + (n === 0 ? ' 今天' : n === 1 ? ' 明天' : ''); }

/* ---------- 待辦事項 ---------- */
function pgTodo(){
  const f = S.todoF;
  const T = DB.tasks.filter(t => t.status !== 'done' && (f === 'all' || t.area === f));
  const by = (a, b) => (a.dueDate || '9').localeCompare(b.dueDate || '9') || byOrd(a, b);
  const wait = T.filter(t => t.status === 'waiting').sort(by);
  const rest = T.filter(t => t.status !== 'waiting');
  const g = { late:[], today:[], week:[], later:[], none:[] };
  rest.forEach(t => { if(!t.dueDate) return g.none.push(t); const n = diff(t.dueDate);
    (n < 0 ? g.late : n === 0 ? g.today : n <= 7 ? g.week : g.later).push(t); });
  Object.values(g).forEach(a => a.sort(by));
  const grp = (title, arr) => arr.length ? `<div class="sec">${title} <span class="n">${arr.length}</span></div>${arr.map(t => taskRow(t)).join('')}` : '';
  const recent = DB.tasks.filter(t => t.status === 'done' && (f === 'all' || t.area === f) && t.completedDate >= addDays(today(), -7)).sort((a, b) => b.completedDate.localeCompare(a.completedDate));
  return hdr('待辦事項') + `
  <div class="qa"><input id="qaIn" data-enter="quickAdd" placeholder="新增待辦，可用「11/25 交成果報告」帶日期"><button class="btn pri" data-act="quickAdd">新增</button></div>
  <div class="chips">${[['all','全部'],['work','工作'],['personal','個人']].map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="setS" data-k="todoF" data-v="${k}">${l}</button>`).join('')}</div>
  ${T.length ? '' : '<div class="empty">目前沒有待辦。</div>'}
  ${grp('逾期', g.late)}${grp('今天', g.today)}${grp('七天內', g.week)}${grp('之後', g.later)}${grp('等待中', wait)}${grp('沒有日期', g.none)}
  <div class="sec">最近 7 天完成 <span class="n">${recent.length}</span><span class="sp"></span>${recent.length ? `<button class="btn sm" data-act="setS" data-k="showDone" data-v="${S.showDone ? '' : '1'}">${S.showDone ? '收起' : '展開'}</button>` : ''}</div>
  ${S.showDone ? recent.map(t => taskRow(t)).join('') : ''}`;
}

/* ---------- 行程表 ---------- */
function pgSched(){
  const f = S.schedF, from = S.showPast ? addDays(today(), -30) : today(), to = addDays(today(), 120);
  let html = '';
  for(let d = from; d <= to; d = addDays(d, 1)){
    const items = dayItems(d, f, false).filter(it => it.k === 'ms' || it.s === d || d === from);
    if(items.length) html += `<div class="sec ${diff(d) === 0 ? 'late' : ''}">${dayLabel(d)}</div>${items.map(it => agRow(it, { range:true })).join('')}`;
  }
  return hdr('行程表', { extra:`<button class="hbtn" data-act="newEvent">＋ 行程</button>` }) + `
  <div class="chips">${[['all','全部'],['work','工作'],['personal','個人'],['school','校曆']].map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="setS" data-k="schedF" data-v="${k}">${l}</button>`).join('')}
  <button class="chip ${S.showPast ? 'on' : ''}" data-act="setS" data-k="showPast" data-v="${S.showPast ? '' : '1'}">含過去 30 天</button></div>
  ${html || '<div class="empty">接下來 120 天沒有行程。</div>'}`;
}

/* ---------- 工作／個人：分類列表 ---------- */
function pgCatList(area){
  const rows = cats(area).map(c => {
    let sub;
    if(area === 'personal' && c.name === '運動紀錄'){ const n = DB.exercise.filter(x => x.date >= weekStart(today())).length; sub = `本週 ${n} 次`; }
    else if(area === 'personal' && c.name === '金錢管理') sub = '需要密碼';
    else {
      const nt = DB.tasks.filter(t => t.status !== 'done' && t.area === area && inCat(t, c)).length;
      const ne = DB.events.filter(e => e.area === area && inCat(e, c) && evEnd(e) >= today()).length;
      const np = DB.plans.filter(p => p.categoryId === c.id).length;
      sub = `${nt} 件待辦 · ${ne} 個行程${np ? ` · ${np} 個計畫` : ''}`;
    }
    return `<div class="row" data-act="openCat" data-id="${c.id}"><div class="body"><div class="t">${catTag(c.id)}</div><div class="meta">${sub}</div></div><span style="color:var(--ink3)">›</span></div>`;
  }).join('');
  const un = DB.tasks.filter(t => t.status !== 'done' && t.area === area && !cat(t.categoryId)).length;
  return hdr(area === 'work' ? '工作' : '個人') + rows +
    (un ? `<div class="row" data-act="openCat" data-id="__none_${area}"><div class="body"><div class="t">${tag('未分類', 0)}</div><div class="meta">${un} 件待辦，點進去分類</div></div><span style="color:var(--ink3)">›</span></div>` : '');
}

/* ---------- 分類內頁 ---------- */
function pgCat(){
  const area = S.page;
  if(S.cat.startsWith('__none_')){
    const T = DB.tasks.filter(t => t.status !== 'done' && t.area === area && !cat(t.categoryId));
    return hdr('未分類', { back:'backCat', backLabel: area === 'work' ? '工作' : '個人' }) + (T.length ? T.map(t => taskRow(t)).join('') : '<div class="empty">都分類好了。</div>');
  }
  const c = cat(S.cat); if(!c){ S.cat = null; return pgCatList(area); }
  const back = { back:'backCat', backLabel: area === 'work' ? '工作' : '個人' };
  if(area === 'personal' && c.name === '運動紀錄') return pgExercise(back);
  if(area === 'personal' && c.name === '金錢管理') return hdr('金錢管理', back) + `<div class="card"><b>🔒 需要密碼才能看</b>
    <p style="font-size:14px;color:var(--ink2)">收入、股市持股會在第 3 階段開通。到時候密碼設在 Apps Script，由後端檢查正確後才把資料傳給網頁，網頁本身不存任何金額。</p></div>`;
  const isHQ = area === 'work' && c.name === '高中優質化';
  const tab = isHQ ? (S.tab || 'main') : 'main';
  const extra = `<button class="hbtn" data-act="newTask" data-cat="${c.id}">＋ 待辦</button><button class="hbtn" data-act="newEvent" data-cat="${c.id}">＋ 行程</button>`;
  let html = hdr(c.name, Object.assign({ extra }, back));
  if(isHQ) html += `<div class="tabs"><button class="${tab === 'main' ? 'on' : ''}" data-act="setS" data-k="tab" data-v="main">工作</button><button class="${tab === 'money' ? 'on' : ''}" data-act="setS" data-k="tab" data-v="money">經費</button></div>`;
  if(tab === 'money') return html + budgetView();

  if(area === 'work'){
    const plans = DB.plans.filter(p => p.categoryId === c.id);
    html += `<div class="sec">計畫 <span class="n">${plans.length}</span><span class="sp"></span><button class="btn sm" data-act="newPlan" data-cat="${c.id}">＋ 計畫</button></div>`;
    html += plans.map(planCard).join('') || '<div class="empty">還沒有計畫。大計畫（例如有里程碑的專案）可以放這裡。</div>';
  }
  const T = DB.tasks.filter(t => t.area === area && inCat(t, c));
  const open = T.filter(t => t.status !== 'done' && !t.planId).sort(byOrd);
  const done = T.filter(t => t.status === 'done').sort((a, b) => (b.completedDate || '').localeCompare(a.completedDate || ''));
  html += `<div class="sec">待辦 <span class="n">${open.length}</span></div>` + (open.length ? sortList(open, { noCat:true }) : '<div class="empty">沒有待辦。</div>');
  const E = DB.events.filter(e => e.area === area && inCat(e, c)).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const up = E.filter(e => evEnd(e) >= today());
  html += `<div class="sec">接下來的行程 <span class="n">${up.length}</span></div>` +
    (up.map(e => `<div class="sec" style="margin:10px 0 0;font-weight:400">${dayLabel(e.startDate)}</div>${agRow({ k:'ev', x:e }, { range:true })}`).join('') || '<div class="empty">沒有行程。</div>');
  const past = E.filter(e => evEnd(e) < today()).reverse();
  html += `<div class="sec">已完成 <span class="n">${done.length} 件待辦 · ${past.length} 個過去行程</span><span class="sp"></span>${done.length || past.length ? `<button class="btn sm" data-act="setS" data-k="showDone" data-v="${S.showDone ? '' : '1'}">${S.showDone ? '收起' : '展開'}</button>` : ''}</div>`;
  if(S.showDone) html += done.map(t => taskRow(t, { noCat:true })).join('') + past.map(e => `<div class="sec" style="margin:10px 0 0;font-weight:400">${fmtW(e.startDate)}</div>${agRow({ k:'ev', x:e })}`).join('');
  return html;
}
function planCard(p){
  const T = DB.tasks.filter(t => t.planId === p.id);
  const open = T.filter(t => t.status !== 'done').sort(byOrd);
  const nd = p.milestones.filter(m => !m.done).length;
  return `<div class="card"><div class="ch" data-act="editPlan" data-id="${p.id}"><b>📁 ${h(p.name)}</b>${tag(p.role, p.role === '承辦' ? 4 : 1)}<span class="ld">${open.length} 件待辦${p.milestones.length ? ` · 里程碑 ${p.milestones.length - nd}/${p.milestones.length}` : ''}</span>${DEL_BTN('plan', p.id)}</div>
  ${p.milestones.map((m, i) => `<div class="ms ${m.done ? 'done' : ''}"><button class="chk ${m.done ? 'on' : ''}" data-act="toggleMs" data-id="${p.id}" data-i="${i}"></button><div style="flex:1"><span class="t">${h(m.title)}</span>${m.mode === 'remind' ? ' <span class="ld">只提醒</span>' : ''}</div><span class="md ${!m.done && m.date && diff(m.date) < 0 ? 'late' : ''}">${m.date ? fmtW(m.date) : '日期未定'}</span><button class="del" data-act="delMsQuick" data-id="${p.id}" data-i="${i}" aria-label="刪除" title="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button></div>`).join('')}
  ${sortList(open, { noCat:true })}
  <div style="margin-top:6px;display:flex;gap:6px"><button class="btn sm" data-act="newTask" data-cat="${p.categoryId}" data-plan="${p.id}">＋ 待辦</button>${p.log.length ? `<span class="ld" style="padding-top:3px">最新筆記：${fmt(p.log[0].date)} ${h(p.log[0].text)}</span>` : ''}</div></div>`;
}

/* ---------- 經費（高中優質化） ---------- */
function budgetView(){
  const B = DB.budget, E = B.expenses;
  const used = (code, c) => E.filter(x => x.code === code && (c === undefined || x.cat === c)).reduce((s, x) => s + (+x.amount || 0), 0);
  let html = `<p class="hint">目前是手動記錄。第 4 階段會改成直接讀你的經費試算表，不用重新輸入。</p>
  <div class="sec">經費總表<span class="sp"></span><button class="btn sm" data-act="newExp">＋ 支出</button><button class="btn sm" data-act="newLine">＋ 計畫經費</button></div>
  <div class="tw"><table><tr><th>計畫</th><th class="num">核定</th><th class="num">已用</th><th class="num">剩餘</th><th class="num">執行率</th></tr>`;
  let ta = 0, tu = 0;
  B.lines.forEach(l => { const u = used(l.code), r = (+l.approved || 0) - u; ta += +l.approved || 0; tu += u;
    html += `<tr data-act="editLine" data-id="${l.id}" style="cursor:pointer"><td>${h(l.code)}${l.name ? ` <span class="ld">${h(l.name)}</span>` : ''}</td><td class="num">${money(l.approved)}</td><td class="num">${money(u)}</td><td class="num ${r < 0 ? 'over' : ''}">${money(r)}</td><td class="num">${+l.approved ? Math.round(u / l.approved * 100) + '%' : '—'}</td></tr>`; });
  html += `<tr><th>合計</th><th class="num">${money(ta)}</th><th class="num">${money(tu)}</th><th class="num ${ta - tu < 0 ? 'over' : ''}">${money(ta - tu)}</th><th class="num">${ta ? Math.round(tu / ta * 100) + '%' : '—'}</th></tr></table></div>`;

  html += `<div class="sec">概算表</div>`;
  B.lines.forEach(l => {
    const rows = (l.items || []).map(it => ({ c: it.cat, p: +it.amount || 0 }));
    E.filter(x => x.code === l.code).forEach(x => { const c = x.cat || '未填類別'; if(!rows.find(r => r.c === c)) rows.push({ c, p:0 }); });
    html += `<div class="card"><div class="ch" data-act="editLine" data-id="${l.id}"><b>${h(l.code)}</b><span class="ld">編輯</span></div>` +
      (rows.length ? `<div class="tw"><table><tr><th>經費類別</th><th class="num">概算</th><th class="num">已用</th><th class="num">剩餘</th></tr>${rows.map(r => { const u = used(l.code, r.c === '未填類別' ? '' : r.c); const o = u > r.p;
        return `<tr><td>${h(r.c)}</td><td class="num">${money(r.p)}</td><td class="num ${o ? 'over' : ''}">${money(u)}</td><td class="num ${o ? 'over' : ''}">${money(r.p - u)}</td></tr>`; }).join('')}</table></div>` : '<div class="empty">還沒有概算項目，點「編輯」加入。</div>') + `</div>`;
  });

  const adv = E.filter(x => ADV.includes(x.adv));
  html += `<div class="sec">代墊追蹤 <span class="n">${adv.length}</span></div><div class="kan">${ADV.map(s => { const L = adv.filter(x => x.adv === s);
    return `<div class="col"><h4>${s} <span class="ld">${L.length} 筆 · ${money(L.reduce((a, x) => a + (+x.amount || 0), 0))}</span></h4>${L.map(x =>
      `<div class="kc" data-act="editExp" data-id="${x.id}"><div>${h(x.desc || x.cat || '支出')} <b>${money(x.amount)}</b></div><div class="ld">${h(x.code)}${x.advBy ? ' · ' + h(x.advBy) + '代墊' : ''}${x.invoice === 'no' ? ' · <span class="late">發票尚未</span>' : ''}${x.date ? ' · ' + fmt(x.date) : ''}</div></div>`).join('') || '<div class="ld">（無）</div>'}</div>`; }).join('')}</div>`;

  html += `<div class="sec">其他經費來源<span class="sp"></span><button class="btn sm" data-act="newFund">＋ 經費來源</button></div><div class="tw"><table><tr><th>名稱</th><th class="num">金額</th><th class="num">已用</th><th class="num">剩餘</th></tr>`;
  B.otherFunds.forEach(f => { const u = used(f.name); html += `<tr data-act="editFund" data-id="${f.id}" style="cursor:pointer"><td>${h(f.name)}${f.note ? ` <span class="ld">${h(f.note)}</span>` : ''}</td><td class="num">${money(f.amount)}</td><td class="num">${money(u)}</td><td class="num ${f.amount - u < 0 ? 'over' : ''}">${money(f.amount - u)}</td></tr>`; });
  html += `</table></div>`;

  const recent = E.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 30);
  html += `<div class="sec">最近支出 <span class="n">${E.length}</span></div>` + (recent.map(x =>
    `<div class="row" data-act="editExp" data-id="${x.id}"><div class="body"><div class="t">${h(x.desc || x.cat || '支出')}</div><div class="meta">${tag(x.code, 1)}${x.cat ? h(x.cat) : ''}${x.date ? ' · ' + fmt(x.date) : ''}${ADV.includes(x.adv) ? ' · 代墊：' + h(x.adv) : ''}</div></div><b class="num">${money(x.amount)}</b></div>`).join('') || '<div class="empty">還沒有支出紀錄。</div>');
  return html;
}

/* ---------- 運動紀錄 ---------- */
function exRange(){
  const r = S.exRange, o = S.exOff, now = new Date();
  if(r === 'week'){ const a = addDays(weekStart(today()), o * 7), b = addDays(a, 6); return { a, b, label: `${fmt(a)}–${fmt(b)}` }; }
  if(r === 'month'){ const d = new Date(now.getFullYear(), now.getMonth() + o, 1); const a = ymd(d); const b = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); return { a, b, label: `${d.getFullYear()} 年 ${d.getMonth() + 1} 月` }; }
  const y = now.getFullYear() + o; return { a: `${y}-01-01`, b: `${y}-12-31`, label: `${y} 年`, y };
}
function pgExercise(back){
  const R = exRange();
  const L = DB.exercise.filter(x => x.date >= R.a && x.date <= R.b).sort((a, b) => b.date.localeCompare(a.date));
  const days = new Set(L.map(x => x.date));
  const run = L.filter(x => x.type === '跑步').reduce((s, x) => s + (+x.distanceKm || 0), 0);
  const yoga = L.filter(x => x.type === '瑜珈').length;
  const mins = L.reduce((s, x) => s + (+x.minutes || 0), 0);
  let vis = '';
  if(S.exRange === 'year'){
    const cnt = Array.from({ length:12 }, (_, i) => new Set(L.filter(x => +x.date.slice(5, 7) === i + 1).map(x => x.date)).size);
    const mx = Math.max(1, ...cnt);
    vis = cnt.map((n, i) => `<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0"><span style="width:34px;color:var(--ink2)">${i + 1} 月</span><div class="bar" style="width:${n / mx * 70}%;${n ? '' : 'background:var(--soft)'}"></div><span>${n} 天</span></div>`).join('');
  } else {
    const lead = (toD(R.a).getDay() + 6) % 7;
    vis =`<div class="mini">${[...'一二三四五六日'].map(w => `<span class="blank">${w}</span>`).join('')}${'<span class="blank"></span>'.repeat(lead)}`;
    for(let d = R.a; d <= R.b; d = addDays(d, 1)) vis += `<span class="${days.has(d) ? 'on' : ''}">${+d.slice(8)}</span>`;
    vis += `</div>`;
  }
  return hdr('運動紀錄', Object.assign({ extra:`<button class="hbtn" data-act="newEx">＋ 紀錄</button>` }, back)) + `
  <div class="chips">${[['week','週'],['month','月'],['year','年']].map(([k, l]) => `<button class="chip ${S.exRange === k ? 'on' : ''}" data-act="setEx" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="navrow"><button class="btn sm" data-act="exNav" data-v="-1">‹</button><div class="lbl">${R.label}</div><button class="btn sm" data-act="exNav" data-v="1">›</button>${S.exOff ? `<button class="btn sm" data-act="exNav" data-v="0">回到現在</button>` : ''}</div>
  <div class="stats"><div class="stat"><div class="v">${days.size}</div><div class="l">運動天數</div></div><div class="stat"><div class="v">${L.length}</div><div class="l">運動次數</div></div>
  <div class="stat"><div class="v">${Math.round(run * 10) / 10}</div><div class="l">跑步距離（公里）</div></div><div class="stat"><div class="v">${yoga}</div><div class="l">瑜珈次數</div></div></div>
  ${mins ? `<p class="hint">總時間 ${mins} 分鐘</p>` : ''}
  ${vis}
  <div class="sec">紀錄 <span class="n">${L.length}</span></div>
  ${L.map(x => `<div class="row" data-act="editEx" data-id="${x.id}"><div class="body"><div class="t">${h(x.type)}${x.distanceKm ? ` ${x.distanceKm} 公里` : ''}${x.minutes ? ` · ${x.minutes} 分鐘` : ''}</div><div class="meta">${fmtW(x.date)}${x.note ? ' · ' + h(x.note) : ''}</div></div></div>`).join('') || '<div class="empty">這段期間沒有紀錄。</div>'}`;
}

/* ---------- 週行程表 ---------- */
function pgWeek(){
  const a = addDays(weekStart(today()), S.weekOff * 7);
  let html = '';
  for(let i = 0; i < 7; i++){ const d = addDays(a, i); const items = dayItems(d, 'all', true);
    html += `<div class="day"><div class="dh ${diff(d) === 0 ? 'today' : ''}">${fmtW(d)}</div>${items.map(it => agRow(it)).join('') || '<div class="ld">—</div>'}</div>`; }
  return hdr('週行程表', { extra:`<button class="hbtn" data-act="newEvent">＋ 行程</button>` }) + `
  <div class="navrow"><button class="btn sm" data-act="weekNav" data-v="-1">‹</button><div class="lbl">${fmt(a)}–${fmt(addDays(a, 6))}</div><button class="btn sm" data-act="weekNav" data-v="1">›</button>${S.weekOff ? `<button class="btn sm" data-act="weekNav" data-v="0">本週</button>` : ''}</div>
  <div class="wk">${html}</div>`;
}

/* ---------- 月行事曆 ---------- */
function pgMonth(){
  const now = new Date(); const first = new Date(now.getFullYear(), now.getMonth() + S.monthOff, 1);
  const fm = ymd(first), lm = ymd(new Date(first.getFullYear(), first.getMonth() + 1, 0));
  const start = weekStart(fm);
  const sel = S.selDay && S.selDay >= fm && S.selDay <= lm ? S.selDay : (S.monthOff ? fm : today());
  let cells = '';
  for(let d = start; d <= lm || (toD(d).getDay() !== 1); d = addDays(d, 1)){
    const items = dayItems(d, 'all', true);
    const cls = it => it.k === 'ev' ? (it.x.area === 'personal' ? 'k-pe' : 'k-ev') : 'k-' + it.k;
    const ttl = it => it.k === 'tk' ? '☐ ' + it.x.title : it.x.title;
    cells += `<div class="d ${d < fm || d > lm ? 'out' : ''} ${diff(d) === 0 ? 'today' : ''} ${d === sel ? 'sel' : ''}" data-act="selDay" data-v="${d}"><div class="num"><span>${+d.slice(8)}</span></div>${items.slice(0, 3).map(it => `<div class="it ${cls(it)}">${h(ttl(it))}</div>`).join('')}${items.length > 3 ? `<div class="more">+${items.length - 3}</div>` : ''}</div>`;
  }
  const items = dayItems(sel, 'all', true);
  return hdr('月行事曆', { extra:`<button class="hbtn" data-act="newEvent" data-date="${sel}">＋ 行程</button>` }) + `
  <div class="navrow"><button class="btn sm" data-act="monthNav" data-v="-1">‹</button><div class="lbl">${first.getFullYear()} 年 ${first.getMonth() + 1} 月</div><button class="btn sm" data-act="monthNav" data-v="1">›</button>${S.monthOff ? `<button class="btn sm" data-act="monthNav" data-v="0">本月</button>` : ''}</div>
  <div class="cal">${[...'一二三四五六日'].map(w => `<div class="h">${w}</div>`).join('')}${cells}</div>
  <div class="sec">${dayLabel(sel)}</div>${items.map(it => agRow(it, { range:true })).join('') || '<div class="empty">這天沒有安排。</div>'}`;
}

/* ---------- 筆記 ---------- */

  <div class="qa"><select id="noteCat" style="flex:1;border:1px solid var(--line);border-radius:6px;padding:7px;background:#fff">${allCats.map(([v, l]) => `<option value="${v}">${h(l)}</option>`).join('')}</select><button class="btn pri" data-act="addNote">記下</button></div>
  <div class="chips">${[['all','全部'],['inbox','未整理']].map(([k, l]) => `<button class="chip ${f === k ? 'on' : ''}" data-act="setS" data-k="noteF" data-v="${k}">${l}</button>`).join('')}</div>
  ${L.map(n => { const tgt = n.linked ? findTarget(n.linked) : null;

function saveSheet(){
  const { kind, d, isNew, extra } = SH;
  if('linksText' in d){ d.links = d.linksText.split('\n').map(s => s.trim()).filter(Boolean); delete d.linksText; }
  if(kind === 'attach'){
    if(!d.target) return toast('請選一件事');
    const [k, id] = d.target.split(':'); const tgt = findTarget({ kind:k, id }); const n = DB.notes.find(x => x.id === d.noteId);
    if(tgt && n){ tgt.log = tgt.log || []; tgt.log.unshift({ id: uid('l'), date: n.date, text: n.text }); n.linked = { kind:k, id }; }
    save(); closeSheet(); render(); return toast('已掛上');
  }
  if(kind === 'task' || kind === 'event'){ if(!d.title.trim()) return toast('請填標題'); d.title = d.title.trim(); }
  if(kind === 'task'){
    if(d.status === 'done'){ if(!d.completedDate) d.completedDate = today(); } else d.completedDate = '';
    if(d.status === 'waiting'){ if(!d.waitingSince) d.waitingSince = today(); } else d.waitingSince = '';
  }
  if(kind === 'event'){ if(!d.startDate) return toast('請填開始日'); if(d.endDate && d.endDate < d.startDate) return toast('結束日比開始日早'); if(d.endDate === d.startDate) d.endDate = ''; }
  if(kind === 'plan' && !d.name.trim()) return toast('請填名稱');
  if(kind === 'ex'){ if(!d.date) return toast('請填日期'); if(!d.type) d.type = '其他'; delete d.typeSel; }
  if(kind === 'exp'){ if(!(+d.amount)) return toast('請填金額'); d.amount = +d.amount; if(d.adv === 'none'){ d.advBy = ''; } }
  if(kind === 'line'){ if(!d.code.trim()) return toast('請填代號'); d.approved = +d.approved || 0; d.items = d.items.filter(it => it.cat);
    const old = DB.budget.lines.find(l => l.id === d.id); if(old && old.code !== d.code) DB.budget.expenses.forEach(x => { if(x.code === old.code) x.code = d.code; }); }
  if(kind === 'fund'){ if(!d.name.trim()) return toast('請填名稱'); d.amount = +d.amount || 0;
    const old = DB.budget.otherFunds.find(f => f.id === d.id); if(old && old.name !== d.name) DB.budget.expenses.forEach(x => { if(x.code === old.name) x.code = d.name; }); }
  const arr = KIND[kind]();
  const i = arr.findIndex(x => x.id === d.id); if(i >= 0) arr[i] = d; else arr.push(d);
  if(extra.fromNote){ const n = DB.notes.find(x => x.id === extra.fromNote); if(n) n.linked = { kind:'task', id:d.id }; }
  save(); closeSheet(); render(); toast(isNew ? '已新增' : '已儲存');
}
function restoreItem(x){
  if(!x) return;
  if(x.kind === 'ms'){ const p = planOf(x.planId); if(p) p.milestones.splice(Math.min(x.idx, p.milestones.length), 0, x.item); return; }
  if(KIND[x.kind]) KIND[x.kind]().push(x.item);
}
function trashIt(kind, id){
  const arr = KIND[kind](); const i = arr.findIndex(x => x.id === id); if(i < 0) return;
  const [item] = arr.splice(i, 1);
  if(kind === 'plan') DB.tasks.concat(DB.events).forEach(x => { if(x.planId === id) x.planId = ''; });
  DB.trash.push({ kind, item, at: today() }); if(DB.trash.length > 30) DB.trash.shift();
  save(); toast('已刪除「' + (item.title || item.name || item.text || item.desc || '') .slice(0, 16) + '」', true);
}

function parseQuick(s){
  const m = s.match(/^(\d{1,2})[\/\.](\d{1,2})\s*/); if(!m) return { title:s };
  const mo = +m[1], dd = +m[2]; if(mo < 1 || mo > 12 || dd < 1 || dd > 31) return { title:s };
  let y = new Date().getFullYear(); if(mo < new Date().getMonth() + 1 - 4) y++;
  return { title: s.slice(m[0].length) || s, dueDate: `${y}-${pad(mo)}-${pad(dd)}` };
}

  newEvent: d => { const c = cat(d.cat); const o = { startDate: d.date || today() };
    if(c){ o.categoryId = c.id; if(c.area === 'personal'){ o.type = '個人行程'; o.area = 'personal'; } else if(EVENT_TYPES.includes(c.name)) o.type = c.name; }
    else if(S.page === 'personal'){ o.type = '個人行程'; o.area = 'personal'; }
    openSheet('event', newEvent(o), true); },
  newPlan: d => openSheet('plan', { id: uid('p'), categoryId: d.cat, name:'', role:'承辦', desc:'', milestones:[], log:[] }, true),
  newEx: () => openSheet('ex', { id: uid('x'), date: today(), type:'跑步', distanceKm:'', minutes:'', note:'' }, true),
  editEx: d => { const x = DB.exercise.find(y => y.id === d.id); if(x) openSheet('ex', x, false); },
  newExp: () => openSheet('exp', { id: uid('x'), code: (DB.budget.lines[0] || {}).code || '', cat:'', amount:'', date: today(), desc:'', adv:'none', advBy:'', invoice:'yes' }, true),
  editExp: d => { const x = DB.budget.expenses.find(y => y.id === d.id); if(x) openSheet('exp', x, false); },
  newLine: () => openSheet('line', { id: uid('b'), code:'', name:'', approved:'', items:[] }, true),
  editLine: d => { const x = DB.budget.lines.find(y => y.id === d.id); if(x) openSheet('line', x, false); },
  newFund: () => openSheet('fund', { id: uid('f'), name:'', amount:'', note:'' }, true),
  editFund: d => { const x = DB.budget.otherFunds.find(y => y.id === d.id); if(x) openSheet('fund', x, false); },
  addNote: () => { const t = $('#noteIn').value.trim(); if(!t) return toast('先寫點內容');
    DB.notes.push({ id: uid('n'), date: today(), text:t, categoryId: $('#noteCat').value, linked:null }); save(); render(); toast('已記下'); },
  delNote: d => { trashIt('note', d.id); render(); },
  noteToTask: d => { const n = DB.notes.find(x => x.id === d.id); if(!n) return; const c = cat(n.categoryId);
    openSheet('task', newTask({ title: n.text.split('\n')[0].slice(0, 60), categoryId: c ? c.id : '', area: c ? c.area : 'work', log:[{ id: uid('l'), date: n.date, text: n.text }] }), true, { fromNote: n.id }); },
  noteAttach: d => { const n = DB.notes.find(x => x.id === d.id); if(n) openSheet('attach', { noteId: n.id, text: n.text, target:'' }, true); },
  openTarget: d => { const t = findTarget({ kind: d.kind, id: d.id }); if(t) openSheet(d.kind, t, false); },
  taskFromEvent: () => { const e = SH.d; const t = newTask({ title:'', categoryId: e.categoryId, area: e.area, eventId: e.id, planId: e.planId || '', dueDate: e.startDate });
    closeSheet(); openSheet('task', t, true); },
  /* 編輯視窗內 */
  seg: d => { const D = SH.d; setPath(D, d.f, d.v);
    if(d.f === 'area'){ D.categoryId = ''; D.planId = ''; }
    if(d.f === 'type'){ const was = D.area; D.area = d.v === '個人行程' ? 'personal' : 'work';
      const c = D.area === 'personal' ? catByName('personal', '個人活動') : catByName('work', d.v);
      const cur = cat(D.categoryId);
      if(was !== D.area || !cur || EVENT_TYPES.includes(cur.name) || cur.name === '個人活動'){ D.categoryId = c ? c.id : ''; D.planId = ''; } }
    if(d.f === 'typeSel'){ D.type = d.v === '其他' ? '' : d.v; }
    renderSheet(); },
  addLog: () => { const i = $('#logIn'); const v = i.value.trim(); if(!v) return; SH.d.log = SH.d.log || []; SH.d.log.unshift({ id: uid('l'), date: today(), text:v }); renderSheet(); const n = $('#logIn'); if(n) n.focus(); },
  delLog: d => { SH.d.log.splice(+d.i, 1); renderSheet(); },
  addMs: () => { SH.d.milestones.push({ id: uid('m'), title:'', date:'', mode:'host', done:false, log:[] }); renderSheet(); },
  delMs: d => { SH.d.milestones.splice(+d.i, 1); renderSheet(); },
  addItem: () => { SH.d.items.push({ cat:'', amount:'' }); renderSheet(); },
  delItem: d => { SH.d.items.splice(+d.i, 1); renderSheet(); },
  closeSheet: () => closeSheet(),
  saveSheet: () => saveSheet(),
  delItemSheet: () => { const { kind, d } = SH; closeSheet(); trashIt(kind, d.id); render(); },
  settings: () => { SH = { kind:'settings', d:{}, isNew:false, extra:{} }; renderSheet(); },
  changeUrl: async () => { const u = $('#urlIn').value.trim(); try{ await ping(u); Sync.set(u); toast('連線成功，重新載入'); setTimeout(() => location.reload(), 600); }catch(e){ toast('連線失敗：' + e.message); } },
  exportJSON: () => { const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' }); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `library-system-v2-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); },
  restore: d => { const [x] = DB.trash.splice(+d.i, 1); restoreItem(x); save(); renderSheet(); render(); toast('已復原'); },
  connect: async () => { const u = $('#urlIn').value.trim(); if(!u) return toast('請貼上網址'); try{ await ping(u); Sync.set(u); init(); }catch(e){ toast('連線失敗：' + e.message); } },
  retry: () => init(),
  createFresh: async () => { DB = seed(); fix(); await saveNow(); if(lastRaw){ localStorage.setItem('libV2Created', '1'); render(); startPoll(); } }
};

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.tagName === 'A') e.preventDefault();
  fn(el.dataset, el);
});
function onField(e){
  const t = e.target; if(!SH || !t.dataset || !t.dataset.f) return;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  setPath(SH.d, t.dataset.f, v);
  if(e.type === 'change' && t.dataset.rr !== undefined){
    if(t.dataset.f === 'categoryId') SH.d.planId = '';
    renderSheet();
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', e => {
  onField(e);
  if(e.target.id === 'impFile' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => { try{ const o = JSON.parse(r.result); if(o.version !== 2) return toast('這不是新版（v2）的備份檔');
      DB = o; fix(); save(); closeSheet(); render(); toast('已匯入'); }catch(err){ toast('檔案格式錯誤'); } };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || e.isComposing) return;
  const a = e.target.dataset && e.target.dataset.enter; if(a && A[a]){ e.preventDefault(); A[a]({}); }
});

/* ---------- 啟動與同步 ---------- */
function connectScreen(msg){
  $('#app').innerHTML = `<div class="center"><h2>連接 Google 試算表</h2><p style="color:var(--ink2);font-size:14px">${h(msg || '貼上 Apps Script 的 /exec 網址（跟舊版用的是同一組）。')}</p>
  <div class="f"><input id="urlIn" value="${h(Sync.url())}" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:8px"></div>
  <button class="btn pri" data-act="connect">測試連線並儲存</button></div>`;
}
function failScreen(msg){
  const first = !localStorage.getItem('libV2Created');
  $('#app').innerHTML = `<div class="center"><h2>連線失敗</h2><p style="color:var(--ink2);font-size:14px">${h(msg)}<br>資料沒有被更動。請確認網路後重試。</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="retry">重新連線</button><button class="btn" data-act="settingsUrl">更換網址</button>
  ${first ? `<button class="btn" data-act="createFresh">建立新的空白資料</button>` : ''}</div>
  ${first ? '<p class="hint">「建立新的空白資料」只會寫入新版的位置，不會碰到舊資料。</p>' : ''}</div>`;
}
A.settingsUrl = () => connectScreen();
async function init(){
  if(!Sync.url()) return connectScreen();
  $('#app').innerHTML = '<div class="center" style="color:var(--ink2)">讀取中…</div>';
  let raw;
  try{ raw = await apiGet(KEY); }catch(e){ return failScreen(e.message); }
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ return failScreen('資料格式錯誤'); } lastRaw = raw; fix(); }
  else { DB = seed(); fix(); await saveNow(); if(!lastRaw) return failScreen('無法建立新資料'); toast('已建立新的空白資料'); }
  localStorage.setItem('libV2Created', '1');
  render(); startPoll();
}
function startPoll(){
  if(pollT) return;
  pollT = setInterval(async () => {
    const ae = document.activeElement;
    if(SH || saveT || document.hidden || (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.value)) return;
    try{ const raw = await apiGet(KEY); if(raw && raw !== lastRaw){ lastRaw = raw; DB = JSON.parse(raw); fix(); render(); toast('資料已更新'); } }catch(e){}
  }, 25000);
}
window.addEventListener('beforeunload', e => { if(saveT){ saveNow(); e.preventDefault(); e.returnValue = ''; } });
init();
</script>
</body>
</html>
